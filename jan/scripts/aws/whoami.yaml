about: >
  Print the caller identity for the AWS credentials stored in pass
  (`AWS/ACCESS_KEY_ID`, `AWS/SECRET_ACCESS_KEY`).
requires: [aws, pass]
env:
  pass:
    AWS_ACCESS_KEY_ID: AWS/ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS/SECRET_ACCESS_KEY
  public:
    AWS_DEFAULT_REGION: ${{ inputs.region }}
inputs:
  region:
    description: AWS region (default us-east-1)
    default: us-east-1
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        aws whoami

        Show the STS caller identity for credentials from pass.

        Setup (once):
        pass insert AWS/ACCESS_KEY_ID
        pass insert AWS/SECRET_ACCESS_KEY

        Usage:
        jan scripts aws whoami run
        jan scripts aws whoami run --region us-west-2
  run:
    about: aws sts get-caller-identity
    exec:
      bash: |
        set -euo pipefail
        aws sts get-caller-identity --output table
