about: >
  Print the caller identity for the active AWS CLI credentials.
requires: [aws]
env:
  public:
    AWS_DEFAULT_REGION: ${{ inputs.region }}
inputs:
  region:
    description: AWS region (default us-east-1)
    default: us-east-1
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        aws-whoami

        Show the STS caller identity using the AWS CLI.

        Uses configured credentials (default profile, AWS_PROFILE, or env vars).

        Usage:
        jan scripts aws aws-whoami run
        jan scripts aws aws-whoami run --region us-west-2
  run:
    about: aws sts get-caller-identity
    exec:
      bash: |
        set -euo pipefail
        aws sts get-caller-identity --output table
