about: >
  List all S3 buckets visible to the active AWS CLI credentials.
requires: [aws]
env:
  public:
    AWS_DEFAULT_REGION: ${{ inputs.region }}
inputs:
  region:
    description: AWS region (default us-east-1)
    default: us-east-1
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        aws-ls-buckets

        List S3 buckets using the AWS CLI.

        Usage:
        jan scripts aws aws-ls-buckets run
  run:
    about: aws s3 ls
    exec:
      bash: |
        set -euo pipefail
        aws s3 ls
