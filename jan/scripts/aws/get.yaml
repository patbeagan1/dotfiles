about: >
  Download a single S3 object to a local path.
requires: [aws]
env:
  public:
    AWS_DEFAULT_REGION: ${{ inputs.region }}
inputs:
  bucket:
    description: S3 bucket name
    required: true
  key:
    description: Object key
    required: true
  dest:
    description: Local file or directory destination
    required: true
  region:
    description: AWS region (default us-east-1)
    default: us-east-1
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        aws-get

        Download one object: s3://BUCKET/KEY -> DEST.

        Usage:
        jan scripts aws aws-get run --bucket my-bucket --key path/to/file.bin --dest ./file.bin
  run:
    about: aws s3 cp object to local
    exec:
      bash: |
        set -euo pipefail
        bucket="${1-}"
        key="${2-}"
        dest="${3-}"
        if [[ -z "$bucket" || -z "$key" || -z "$dest" ]]; then
          echo "bucket, key, and dest are required" >&2
          exit 2
        fi
        uri="s3://${bucket}/${key#/}"
        # If dest is an existing directory (or ends with /), keep aws cp semantics
        if [[ -d "$dest" || "$dest" == */ ]]; then
          mkdir -p "$dest"
        else
          mkdir -p "$(dirname -- "$dest")"
        fi
        aws s3 cp "$uri" "$dest"
      argv:
        - "${{ inputs.bucket }}"
        - "${{ inputs.key }}"
        - "${{ inputs.dest }}"
