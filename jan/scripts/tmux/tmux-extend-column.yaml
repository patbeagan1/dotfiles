about: |
  Extends the current tmux window by adding 2 new panes in a new column to the right of the active pane. Focus remains in the original pane after the layout is created.
commands:
  help:
    about: Describe this script.
    exec:
      bash: |
          cat <<'EOF'
          tmux-extend-column

          Extends the current tmux window by adding 2 new panes in a new column to the right of the active pane. Focus remains in the original pane after the layout is created.

          EOF
  run:
    about: 'Run the linked script; forwards args.'
    exec:
      bash: |
          # tmux-extend-column: Add 2 new panes as a new column to the current tmux window.
          # (c) 2025 Pat Beagan: MIT License

          set -euo pipefail

          usage() {
              cat << EOF
          Usage: tmux-extend-column [OPTIONS]

          Extends the current tmux window with 2 new panes in a new column to the right.

          Options:
            -h, --help    Show this help and exit

          Must be run from inside an active tmux session.
          EOF
          }

          for arg in "$@"; do
              case "$arg" in
                  -h|--help)
                      usage
                      exit 0
                      ;;
              esac
          done

          if [[ -z "${TMUX:-}" ]]; then
              echo "Error: Not running inside tmux. Run this script from within a tmux session." >&2
              exit 1
          fi

          # Remember current pane so we can return focus to it after creating the column
          current_pane=$(tmux display-message -p '#{pane_id}')

          # Create new column: split current pane horizontally (new pane to the right)
          tmux split-window -h
          # Split the new pane vertically so we have 2 panes in the new column
          tmux split-window -v

          # Return focus to the original pane
          tmux select-pane -t "$current_pane"

          echo "Added 2 new panes as a new column to the right."
      passthrough: true
