about: List restic snapshots (hourly 1TB by default).
requires: [restic, uv]
packages:
  uv:
    project: deps/restic-framework-backup
    python: ">=3.10"
inputs:
  target:
    description: "Repository profile: hourly (1TB) or monthly (Framework Backups)"
    default: hourly
    choices: [hourly, monthly]
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        restic-snapshots

        List snapshots in the selected repository (default: hourly / 1TB).

        Examples:
          restic-snapshots
          restic-snapshots --compact
          restic-snapshots --target monthly
  run:
    about: List snapshots
    exec:
      bash: scripts/misc/restic-backup/restic-cmd.sh
      argv:
        - "${{ inputs.target }}"
        - snapshots
      passthrough: true
