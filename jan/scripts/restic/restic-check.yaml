about: Verify restic repository integrity.
requires: [restic, uv]
packages:
  uv:
    project: deps/restic-framework-backup
    python: ">=3.10"
inputs:
  target:
    description: "Repository profile: hourly (1TB) or monthly (Framework Backups)"
    default: hourly
    choices: [hourly, monthly]
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        restic-check

        Verify repository integrity (wraps `restic check`).

        Examples:
          restic-check
          restic-check --read-data
          restic-check --target monthly
  run:
    about: Check repository
    exec:
      bash: scripts/misc/restic-backup/restic-cmd.sh
      argv:
        - "${{ inputs.target }}"
        - check
      passthrough: true
