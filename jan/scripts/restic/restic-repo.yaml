about: |
  Inspect restic repositories (passthrough any restic subcommand).
  Uses the same config and credentials as restic-backup.
requires: [restic, uv]
aliases: [rr]
packages:
  uv:
    project: deps/restic-framework-backup
    python: ">=3.10"
inputs:
  target:
    description: "Repository profile: hourly (1TB) or monthly (Framework Backups)"
    default: hourly
    choices: [hourly, monthly]
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        restic-repo (alias: rr)

        Passthrough for any restic subcommand against the configured repos.
        Prefer the dedicated restic-* helpers for common ops:
          restic-snapshots  restic-ls  restic-stats  restic-find  restic-check

        Repositories:
          hourly  → /run/media/patrick/1TB/restic-documents
          monthly → /run/media/patrick/Framework Backups/restic-documents

        Examples:
          restic-repo
          restic-repo snapshots
          restic-repo ls latest /home/patrick/Documents/Github
          restic-repo diff latest~1 latest
          restic-repo --target monthly snapshots

        Default profile is hourly (1TB). Use --target monthly for the archive.
  run:
    about: Run a restic subcommand (default snapshots)
    exec:
      bash: scripts/misc/restic-backup/restic-cmd.sh
      argv:
        - "${{ inputs.target }}"
      passthrough: true
