about: |
  Adds a festive birthday cake ASCII decoration to the terminal, colored with
  chalk and assembled with lodash. Uses `exec.node` (inline) with packages.pnpm
  and a minimum Node version.
packages:
  pnpm:
    node: ">=18"
    packages:
      - chalk@4.1.2
      - lodash@4.17.21
inputs:
  name:
    description: Optional celebrant name
    default: Birthday
tests:
  given_a_name_when_run_then_mentions_birthday:
    when: |
      run --name Ada
    then: |
      test "$JAN_STATUS" -eq 0
      grep -q 'Happy Birthday' "$JAN_STDOUT_FILE"
      grep -q 'Ada' "$JAN_STDOUT_FILE"
commands:
  help:
    about: Describe this script.
    exec:
      bash: |
          cat <<'EOF'
          birthday-decorate

          Adds a festive birthday cake ASCII decoration to the terminal, colored
          with chalk and assembled with lodash (via packages.pnpm + exec.node).

          You can still use argv: [node, -e, …] instead of exec.node if you prefer.

          usage:
            jan scripts time birthday-decorate run
            jan scripts time birthday-decorate run --name Ada

          EOF
  run:
    about: Print the birthday decoration.
    exec:
      node: |
        const chalk = require("chalk");
        const _ = require("lodash");

        // exec.node inline: process.argv[0] is node; inputs start at [1].
        let name = ((process.argv[1] || "").trim() || "");
        if (name) {
          name = `, ${name}`;
        }

        const wishes = _.shuffle([
          "Make a wish!",
          "Another trip around the sun.",
          "Cake first, adulting later.",
          "May your bugs be few.",
          "Confetti mode: enabled.",
        ]);
        const wish = wishes[0];

        const cake = [
          "        ,,,,,,",
          "      .;;;;;;;.",
          "     ;;;'   ';;;",
          "     ;;;     ;;;",
          "     ';;;;;;;;;' ",
          "       ';;;;;'  ",
        ];
        const candles = "       i i i i";
        const flames = "       * * * *";

        const banner = chalk.bold.magenta(
          _.pad(` Happy Birthday${name}! `, 28, "*")
        );
        const line = chalk.dim(_.repeat("·", 28));

        console.log("");
        console.log(banner);
        console.log(line);
        console.log(chalk.yellow(flames));
        console.log(chalk.whiteBright(candles));
        for (const row of cake) {
          console.log(chalk.cyan(row));
        }
        console.log(line);
        console.log(chalk.green(`  ${wish}`));
        console.log(chalk.bold.red("  🎂  ") + chalk.bold.yellow("🎉") + chalk.bold.blue("  🎈"));
        console.log("");
        console.log(
          chalk.gray(
            `  (chalk@${require("chalk/package.json").version}, lodash@${require("lodash/package.json").version}; node ${process.versions.node})`
          )
        );
        console.log("");
      argv:
        - "${{ inputs.name }}"
