about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      argv:
        - bash
        - '-lc'
        - |
          cat <<'EOF'
          server

          A script for automated tasks.

          EOF
  run:
    about: 'Run the linked script; forwards args.'
    exec:
      argv:
        - bash
        - -lc
        - |
          # (c) 2022 Pat Beagan: MIT License

          server () 
          { 
              if [ $# -lt 2 ]; then
                  port="$1";
                  if [ -z "$port" ]; then
                      port="8000";
                  fi;
                  echo Running server on "$port";
                  python -m SimpleHTTPServer "$port";
              else
                  echo Too many arguments.;
              fi
          }

          server "$@"
      passthrough: true
