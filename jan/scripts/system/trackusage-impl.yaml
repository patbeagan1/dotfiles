about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      argv:
        - bash
        - '-lc'
        - |
          cat <<'EOF'
          trackusage-impl

          A script for automated tasks.

          EOF
  run:
    about: 'Run the linked script; forwards args.'
    exec:
      argv:
        - bash
        - -lc
        - |
          # (c) 2022 Pat Beagan: MIT License
          set -euo pipefail

          if [ -z "$1" ]; then
              echo "Requires a command name, to track usages."
              exit 1;
          fi
          foldername="$HOME/p-tracked-commands"
          mkdir -p "$foldername"
          echo >> "$foldername"/"$(basename "$1")"
      passthrough: true
