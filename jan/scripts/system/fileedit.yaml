about: Converted from aliases/alias_unix.zsh (`fileedit`).
requires:
  - fzf
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        fileedit

        Converted from aliases/alias_unix.zsh (`fileedit`).

  run:
    about: "Run the linked script; forwards args."
    requires:
      - ag
      - fzf
    exec:
      zsh: |
        fileedit () { 
        	if ! command -v ag &> /dev/null; then
        		echo "The 'ag' command is not installed. Please install it to use this function."
        		return
        	fi
        	local filename="$(ag -g "$1" | fzf)"; 
        	if [ -z "$filename" ] ; then 
        		echo "No files to edit."
        		return ; 
        	else 
        		vi "$filename"  ; 
        	fi
        }      

        fileedit "$@"

      passthrough: true
