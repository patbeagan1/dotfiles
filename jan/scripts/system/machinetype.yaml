about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        machinetype

        A script for automated tasks.

  run:
    about: 'Run the linked script; forwards args.'
    exec:
      bash: |
        # (c) 2022 Pat Beagan: MIT License

        machinetype () 
        { 
            unameOut="$(uname -s)";
            case "${unameOut}" in 
                Linux*)
                    machine=Linux
                ;;
                Darwin*)
                    machine=Mac
                ;;
                CYGWIN*)
                    machine=Cygwin
                ;;
                MINGW*)
                    machine=MinGw
                ;;
                *)
                    machine="UNKNOWN:${unameOut}"
                ;;
            esac;
            echo -n ${machine}
        }

        machinetype "$@"
      passthrough: true
