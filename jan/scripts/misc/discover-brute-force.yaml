about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      argv:
        - bash
        - '-lc'
        - |
          cat <<'EOF'
          discover-brute-force

          A script for automated tasks.

          EOF
  run:
    about: 'Run the linked script; forwards args.'
    exec:
      argv:
        - bash
        - -lc
        - |
          # (c) 2022 Pat Beagan: MIT License

          discover-brute-force () 
          { 
              sudo zcat /var/log/auth.log.*.gz |\
              awk '/Failed password/&&!/for invalid user/{a[$9]++}/Failed password for invalid user/{a["*" $11]++}END{for (i in a) printf "%6s\t%s\n", a[i], i|"sort -n"}'
          }

          discover-brute-force "$@"
          trackusage "$0"
      passthrough: true
