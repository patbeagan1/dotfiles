about: >
  Open a file or URL with the platform default handler. Uses `open` on macOS
  and `xdg-open` on Linux.
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        open

        Open files or URLs with the OS default application.

        Usage:
          jan scripts misc open run ./file.pdf
          jan scripts misc open run https://example.com

        macOS: open
        Linux: xdg-open
  run:
    about: Open path/URL with the OS default handler
    exec:
      bash: |
        set -euo pipefail
        if [[ $# -lt 1 ]]; then
          echo "open: missing path or URL" >&2
          exit 2
        fi
        case "$(uname -s)" in
          Darwin)
            command open "$@"
            ;;
          Linux)
            if ! command -v xdg-open >/dev/null 2>&1; then
              echo "open: xdg-open not found (install xdg-utils)" >&2
              exit 127
            fi
            xdg-open "$@"
            ;;
          *)
            echo "open: unsupported OS $(uname -s) (need macOS open or Linux xdg-open)" >&2
            exit 1
            ;;
        esac
      passthrough: true
