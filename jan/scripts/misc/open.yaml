about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      argv:
        - bash
        - '-lc'
        - |
          cat <<'EOF'
          open

          A script for automated tasks.

          EOF
  run:
    about: 'Run the linked script; forwards args.'
    exec:
      argv:
        - bash
        - -lc
        - |
          # (c) 2022 Pat Beagan: MIT License

          open () 
          { 
              if [ "$(uname)" == "Linux" ]; then
                  gnome-open "$@";
              else
                  if [ "$(uname)" == "Darwin" ]; then
                      command open "$@";
                  else
                      echo "This command is not supported.";
                  fi;
              fi
          }

          open "$@"
      passthrough: true
