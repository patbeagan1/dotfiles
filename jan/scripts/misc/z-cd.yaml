about: Converted from aliases/alias_teleport.zsh (`tp`).
requires:
  - fzf
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        z-cd

        Converted from aliases/alias_teleport.zsh (`tp`).

  run:
    about: 'Run the linked script; forwards args.'
    exec:
      zsh: |
        if command -v zoxide >/dev/null 2>&1; then
          zoxide query -l | fzf -1
        elif typeset -f zshz >/dev/null 2>&1; then
          # zsh-z exposes `z` as an alias for `zshz`
          zshz -l | cut -d'/' -f2-100 | sed 's:^:/:g' | fzf -1
        else
          echo "z-cd: need zoxide or zsh-z (z)" >&2
          return 1
        fi

      passthrough: true
