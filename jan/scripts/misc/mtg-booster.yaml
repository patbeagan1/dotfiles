about: Generate sealed-deck HTML boosters from Scryfall and zip them.
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        mtg-booster

        Generate sealed-deck HTML boosters from Scryfall and zip them.
        Writes sealed-deck-N.zip in the current directory.

        Requires on host: deno, zip
  run:
    about: 'Run the linked script; forwards args.'
    include:
      path: scripts/misc/mtg-booster.js
      argv:
        - deno
        - run
        - --allow-net
        - --allow-write
        - --allow-read
        - --allow-run
      passthrough: true
requires:
  - deno
  - zip
