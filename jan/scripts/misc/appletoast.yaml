about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      argv:
        - bash
        - '-lc'
        - |
          cat <<'EOF'
          appletoast

          A script for automated tasks.

          EOF
  run:
    about: 'Run the linked script; forwards args.'
    exec:
      argv:
        - bash
        - -lc
        - |
          # (c) 2022 Pat Beagan: MIT License

          appletoast () 
          { 
              title="$1";
              body="$2";
              osascript -e 'on run {body, title}' -e 'display notification {body} with title {title}' -e 'end run' "$body" "$title"
          }
          appletoast "$@"
      passthrough: true
