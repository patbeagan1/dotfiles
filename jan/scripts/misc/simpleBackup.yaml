about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      bash: |
          cat <<'EOF'
          simpleBackup

          A script for automated tasks.

          EOF
  run:
    about: 'Run the linked script; forwards args.'
    exec:
      bash: |
          # (c) 2022 Pat Beagan: MIT License


          DATE=$(date +%Y-%m-%d-%H%M%S)
          BACKUP_DIR="$HOME"
          SOURCE="$HOME/Downloads/MyHome"

          tar -cvzpf $BACKUP_DIR/backup-$DATE.tar.gz $SOURCE
      passthrough: true
