about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      argv:
        - bash
        - '-lc'
        - |
          cat <<'EOF'
          snippets

          A script for automated tasks.

          EOF
  run:
    about: 'Run the linked script; forwards args.'
    exec:
      argv:
        - zsh
        - -c
        - |
          function main() {
            local filename=""
            if [ -z "$1" ]; then 
          	  filename="snippet.txt"
            else
          	  filename="$1"
            fi
            eval "$(fzf < "$filename")"
          }
          main "$@"
      passthrough: true
