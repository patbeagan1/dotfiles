about: |
  Hourly restic backup of ~/Documents to the 1TB drive (when mounted).
  Scheduled via jan cron. For the Framework Backups archive, see restic-backup-archive.
requires: [restic, uv]
packages:
  uv:
    project: deps/restic-framework-backup
    python: ">=3.10"
cron: "0 * * * *"
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        restic-backup

        Hourly backup of ~/Documents to the 1TB drive:
          /run/media/patrick/1TB/restic-documents

        Skips quietly when the drive is not mounted (safe for jan cron).

        Scheduled: every hour (`cron: 0 * * * *`). Install the jan cron runner:
          jan cron install

        Examples:
          restic-backup run
          restic-backup estimate
          restic-backup init
          restic-backup migrate    # one-time copy from 1TB → Framework Backups

        Archive copy (monthly, larger drive): restic-backup-archive run

        Environment:
          RESTIC_BACKUP_CONFIG  override config path
          RESTIC_MIGRATE_FROM   source repo for migrate (default: 1TB)
          RESTIC_MIGRATE_TO     destination repo for migrate (default: monthly profile repo)
  run:
    about: Run hourly backup to 1TB drive
    exec:
      bash: scripts/misc/restic-backup/run.sh
      argv:
        - hourly
  estimate:
    about: Dry-run hourly backup estimate
    exec:
      bash: scripts/misc/restic-backup/estimate.sh
      argv:
        - hourly
  init:
    about: Initialize the 1TB restic repository
    exec:
      bash: scripts/misc/restic-backup/init.sh
      argv:
        - hourly
  migrate:
    about: Copy snapshots from 1TB repo to Framework Backups repo
    exec:
      bash: scripts/misc/restic-backup/migrate.sh
  setup:
    about: Create config.yaml from example with a generated encrypted password
    exec:
      bash: scripts/misc/restic-backup/setup.sh
  encrypt:
    about: Encrypt a password for manual config.yaml editing
    exec:
      bash: scripts/misc/restic-backup/encrypt.sh
