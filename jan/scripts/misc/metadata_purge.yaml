about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      argv:
        - bash
        - '-lc'
        - |
          cat <<'EOF'
          metadata_purge

          A script for automated tasks.

          EOF
  run:
    about: 'Run the linked script; forwards args.'
    exec:
      argv:
        - bash
        - -lc
        - |
          # (c) 2022 Pat Beagan: MIT License

          metadata_purge () 
          { 
              for i in *.jpg;
              do
                  echo "Processing $i";
                  exiftool -all= "$i";
              done
          }

          metatdata_purge "$@"
          trackusage "$0"
      passthrough: true
