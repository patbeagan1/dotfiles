about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      argv:
        - bash
        - '-lc'
        - |
          cat <<'EOF'
          svn

          A script for automated tasks.

          EOF
  run:
    about: 'Run the linked script; forwards args.'
    exec:
      argv:
        - bash
        - -lc
        - |
          # (c) 2022 Pat Beagan: MIT License

          svn () 
          { 
              if [[ "$@" == "add all" ]] || [[ "$@" == "addall" ]]; then
                  command svn add $(svn st | grep ? | sed s"/\?//");
              else
                  if [[ "$@" == "rm all" ]] || [[ "$@" == "rmall" ]]; then
                      command svn rm $(svn st | grep ! | sed s"/\!//");
                  else
                      if [[ "$@" == "log" ]]; then
                          command svn log | less;
                      else
                          command svn "$@";
                      fi;
                  fi;
              fi
          }

          svn "$@"
      passthrough: true
