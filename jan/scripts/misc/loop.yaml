about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        loop

        A script for automated tasks.

  run:
    about: 'Run the linked script; forwards args.'
    exec:
      bash: |
        # (c) 2022 Pat Beagan: MIT License
        shopt -s expand_aliases
        alias cputemp='jan --no-log scripts system cputemp run'

        loop () 
        {
            local shouldClear='false'	
            if [ "$1" == "-c" ]; then
            	shouldClear="true"
        	shift;
            fi;

            while :; do
                eval $@;
                sleep 0.5;
                if [ $shouldClear == "true" ]; then
                    clear;
                fi;
            done
        }

        loop "$*"
      passthrough: true
