about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        groceries

        A script for automated tasks.

  run:
    about: 'Run the linked script; forwards args.'
    exec:
      zsh: |
        function q-heb {
        web-open 'https://www.heb.com/search?Ns=product.salePrice%7C0&q='"$1"

        }
        while IFS= read -r line; do q-heb $line; sleep 20; done < "$1"
      passthrough: true
