about: |
  Inspect JSON with Jackson (via packages.gradle): pretty-print (ANSI-colored),
  structural summary, or a simple dotted-path extract. Useful for API payloads
  and config dumps. jan compiles the Kotlin once into the package cache. Shares
  the jackson-databind pin with `json-keys` (same gradle env hash).
packages:
  gradle:
    - com.fasterxml.jackson.core:jackson-databind:2.18.3
inputs:
  file:
    description: Path to a JSON file, or - for stdin
    default: "-"
  mode:
    description: "pretty | summary | path (default pretty)"
    default: pretty
  path:
    description: Dotted path for mode=path (e.g. data.items.0.name)
    default: ""
commands:
  help:
    about: Describe this script.
    exec:
      argv:
        - bash
        - '-lc'
        - |
          cat <<'EOF'
          json-summary

          Inspect JSON with Jackson (packages.gradle → classpath via exec.kotlin).

          usage:
            jan scripts files json-summary run --file payload.json
            jan scripts files json-summary run --file payload.json --mode summary
            jan scripts files json-summary run --file payload.json --mode path --path data.items.0
            cat payload.json | jan scripts files json-summary run --file -

          modes:
            pretty   Indent and print the document (ANSI colors; set NO_COLOR=1 to disable)
            summary  Types, object keys, array lengths (recursive)
            path     Extract a dotted path (numbers index arrays)

          Requires: gradle (first resolve), kotlinc (first compile), kotlin (run).
          EOF
  run:
    about: Pretty-print, summarize, or extract from JSON.
    exec:
      kotlin: scripts/files/json-summary.kt
      argv:
        - "${{ inputs.file }}"
        - "${{ inputs.mode }}"
        - "${{ inputs.path }}"
