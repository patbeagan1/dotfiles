about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      bash: |
          cat <<'EOF'
          remove_empty_dirs

          A script for automated tasks.

          EOF
  run:
    about: 'Run the linked script; forwards args.'
    exec:
      bash: |
          # (c) 2022 Pat Beagan: MIT License

          set -euo pipefail
          IFS=$'\n\t'

          remove_empty_dirs () 
          { 
              find . -type d -empty | xargs -I % rmdir %
          }

          remove_empty_dirs "$@"
      passthrough: true
