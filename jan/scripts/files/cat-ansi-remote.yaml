about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        cat-ansi-remote

        A script for automated tasks.

  run:
    about: 'Run the linked script; forwards args.'
    exec:
      zsh: |
        set -euo pipefail
        setopt aliases
        alias cat-ansifile='jan --no-log scripts files cat-ansifile run'

        scriptname="$(basename "$0")"
        help() {
            error_code=$?
            echo "
        Usage: $scriptname [-h|--help] <url>

        Displays ANSI content from a remote URL with proper encoding and visual effects.
        Downloads the content from the URL and displays it using cat-ansifile.

        Arguments:
          url    Remote URL containing ANSI content

        Features:
          - Downloads content from remote URL using curl
          - Clears screen before displaying (ESC c)
          - Uses cat-ansifile for proper encoding and display effects
          - Handles remote ANSI art and BBS-style content

        Examples:
          $scriptname http://example.com/ansi_art.txt
          $scriptname https://bbs.example.com/art.ans
        "
            exit $error_code
        }

        main() {

            emulate -L zsh
            zmodload zsh/zutil || return 1

            local help
            zparseopts -D -F -K -- \
                {h,-help}=help ||
                return 1

            if (($#help)); then help; fi

        cat-ansi-remote () {
        	cat-ansifile <(printf "\033c" && curl -sS "$1")
        }

            cat-ansi-remote "$@" || help
        }

        main "$@" || help
      passthrough: true
