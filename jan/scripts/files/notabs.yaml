about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      argv:
        - bash
        - '-lc'
        - |
          cat <<'EOF'
          notabs

          A script for automated tasks.

          EOF
  run:
    about: 'Run the linked script; forwards args.'
    exec:
      argv:
        - bash
        - -lc
        - |
          # (c) 2022 Pat Beagan: MIT License

          notabs () 
          { 
              if [ $# -lt 2 ]; then
                  echo "Usage: notabs <file> <num spaces to use>";
              else
                  n="";
                  for i in $(seq 1 $2);
                  do
                      n+=" ";
                  done;
                  sed "s/	/$n/g" $1;
              fi
          }

          notabs "$@"
      passthrough: true
