about: Archive extractor (extract_p). Avoids clashing with the OMZ extract plugin.
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        extract_p

        Extract common archive formats (zip, tar, rar, 7z, ...).
        Named extract_p so it does not shadow Oh My Zsh's extract plugin.

        Usage:
          jan scripts files extract_p run archive.tar.gz
          extract_p archive.zip

  run:
    about: 'Run the linked script; forwards args.'
    exec:
      zsh: |
        function extract_p {
            # function Extract for common file formats
            # https://github.com/xvoland/Extract

            SAVEIFS=$IFS
            IFS="$(printf '\n\t')"
            if [ -z "$1" ]; then
                # display usage if no parameters given
                echo "Usage: extract_p <path/file_name>.<zip|rar|bz2|gz|tar|tbz2|tgz|Z|7z|xz|ex|tar.bz2|tar.gz|tar.xz>"
                echo "       extract_p <path/file_name_1.ext> [path/file_name_2.ext] [path/file_name_3.ext]"
            else
                for n in "$@"
                do
                    if [ -f "$n" ] ; then
                        case "${n%,}" in
                            *.lzma)
                                unlzma ./"$n"
                            ;;
                            *.cbt|*.tar.bz2|*.tar.gz|*.tar.xz|*.tbz2|*.tgz|*.txz|*.tar)
                                tar xvf "$n"
                            ;;
                            *.bz2)
                                bunzip2 ./"$n"
                            ;;
                            *.cbr|*.rar)
                                unrar x -ad ./"$n"
                            ;;
                            *.gz)
                                gunzip ./"$n"
                            ;;
                            *.cbz|*.epub|*.zip)
                                unzip ./"$n"
                            ;;
                            *.z)
                                uncompress ./"$n"
                            ;;
                            *.7z|*.apk|*.arj|*.cab|*.cb7|*.chm|*.deb|*.dmg|*.iso|*.lzh|*.msi|*.pkg|*.rpm|*.udf|*.wim|*.xar)
                                7z x ./"$n"
                            ;;
                            *.xz)
                                unxz ./"$n"
                            ;;
                            *.exe)
                                cabextract ./"$n"
                            ;;
                            *.cpio)
                                cpio -id < ./"$n"
                            ;;
                            *.cba|*.ace)
                                unace x ./"$n"
                            ;;
                            *.zpaq)
                                zpaq x ./"$n"
                            ;;
                            *.arc)
                                arc e ./"$n"
                            ;;
                            *.cso)
                                ciso 0 ./"$n" ./"$n.iso" && \
                                extract_p $n.iso && \rm -f $n
                            ;;
                            *)
                                echo "extract_p: '$n' - unknown archive method"
                                return 1
                            ;;
                        esac
                    else
                        echo "'$n' - file does not exist"
                        return 1
                    fi
                done
            fi
            IFS=$SAVEIFS
        }

        extract_p "$@"

      passthrough: true
