about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        gitfilehistory

        A script for automated tasks.

  run:
    about: 'Run the linked script; forwards args.'
    exec:
      bash: |
        # (c) 2022 Pat Beagan: MIT License

        gitfilehistory () 
        { 
            git log -m --oneline --full-history --pretty=tformat:"%h %ar %Cred%an %Creset%s" --follow "${1}"
        }

        gitfilehistory "$@"
      passthrough: true
