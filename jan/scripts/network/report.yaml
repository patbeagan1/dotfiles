about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        report

        A script for automated tasks.

  run:
    about: 'Run the linked script; forwards args.'
    exec:
      bash: |
        # (c) 2022 Pat Beagan: MIT License
        shopt -s expand_aliases
        alias loop='jan --no-log scripts misc loop run'

        report () 
        { 
            loop "clear; df; echo; w; echo; ps -e -o pcpu -o ruser -o args|sort -nr|grep -v %CPU|head -1; sleep 5"
        }

        report "$@"
      passthrough: true
