about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      argv:
        - bash
        - '-lc'
        - |
          cat <<'EOF'
          img_gif_to_spritesheet

          A script for automated tasks.

          EOF
  run:
    about: 'Run the linked script; forwards args.'
    exec:
      argv:
        - bash
        - -lc
        - |
          # (c) 2022 Pat Beagan: MIT License

          set -euo pipefail
          IFS=$'\n\t'

          img_gif_to_spritesheet ()
          {
              in="$1";
              out="$2";

              mkdir -p out-"$out"
              cd out-"$out"

              convert ../"$in" -resize 64x64 -gravity center -extent 64x64 -fill transparent "interim.png"
              montage "interim-"* -background transparent -geometry 64x64+0+0 "$out"
          }

          img_gif_to_spritesheet "$@"
      passthrough: true
