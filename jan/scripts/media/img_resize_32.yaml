about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        img_resize_32

        A script for automated tasks.

  run:
    about: 'Run the linked script; forwards args.'
    exec:
      bash: |
        # (c) 2022 Pat Beagan: MIT License

        set -euo pipefail
        IFS=$'\n\t'

        img_resize_32 ()
        {
            in="$1";
            out="$2";
            convert "$in" -resize 32x32 -gravity center -extent 32x32 -fill white "$out"
        }

        img_resize_32 "$@"
      passthrough: true
