about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      argv:
        - bash
        - '-lc'
        - |
          cat <<'EOF'
          qrencoder

          A script for automated tasks.

          EOF
  run:
    about: 'Run the linked script; forwards args.'
    exec:
      argv:
        - bash
        - -lc
        - |
          qr() {
              local filename="/tmp/qr-output-$(python3 -c 'import time; print(time.time())').png"
              qrencode -l L -v 1 -o "$filename" "$1" &&
                  echo "$filename" &&
                  open "$filename"
          }
          qr "$1"
          trackusage "$0"
      passthrough: true
