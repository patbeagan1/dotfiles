about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        img_wiggle_parallel

        A script for automated tasks.

  run:
    about: 'Run the linked script; forwards args.'
    exec:
      bash: |
        # (c) 2022 Pat Beagan: MIT License

        img_wiggle_parallel ()
        {
            convert -crop 50%x100% +repage "$1" mid.jpg;
            convert -delay 15 -loop 0 mid*.jpg out.gif
        }
        img_wiggle_parallel "$@"
      passthrough: true
