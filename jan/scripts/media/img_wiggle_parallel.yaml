about: A script for automated tasks.
commands:
  help:
    about: Describe this script.
    exec:
      argv:
        - bash
        - '-lc'
        - |
          cat <<'EOF'
          img_wiggle_parallel

          A script for automated tasks.

          EOF
  run:
    about: 'Run the linked script; forwards args.'
    exec:
      argv:
        - bash
        - -lc
        - |
          # (c) 2022 Pat Beagan: MIT License

          img_wiggle_parallel ()
          {
              convert -crop 50%x100% +repage "$1" mid.jpg;
              convert -delay 15 -loop 0 mid*.jpg out.gif
          }
          img_wiggle_parallel "$@"
      passthrough: true
