              tmpdir="$(mktemp -d)"
              trap 'rm -rf "$tmpdir"' EXIT
              cat >"$tmpdir/_appletoast" <<'JAN_EOF_appletoast__appletoast_919fc2f50e08'
              #compdef appletoast

              # Zsh completion for appletoast
              # This script displays a macOS notification with a title and body.
              # Usage: appletoast "Title" "Body"

              _appletoast() {
                  _arguments -C \
                      '1:Title: ' \
                      '2:Body: '
              }

              _appletoast "$@"
              JAN_EOF_appletoast__appletoast_919fc2f50e08
              chmod +x "$tmpdir/_appletoast" 2>/dev/null || true
              cat >"$tmpdir/appletoast.sh" <<'JAN_EOF_appletoast_appletoast_sh_e95e1dd47bba'
              #!/bin/bash 
              # (c) 2022 Pat Beagan: MIT License

              appletoast () 
              { 
                  title="$1";
                  body="$2";
                  osascript -e 'on run {body, title}' -e 'display notification {body} with title {title}' -e 'end run' "$body" "$title"
              }
              appletoast "$@"
              trackusage "$0"
              JAN_EOF_appletoast_appletoast_sh_e95e1dd47bba
              chmod +x "$tmpdir/appletoast.sh" 2>/dev/null || true
              cd "$tmpdir"
              exec "$tmpdir/appletoast.sh" "$@"
