              #!/usr/bin/env python3

              """
              Script Name: color_csv_display.py
              Description: This script reads a CSV file and prints each column in a different ANSI color.
              Usage: python color_csv_display.py -f <path_to_csv_file>
              """

              import csv
              import argparse

              # ANSI color codes
              COLORS = [
                  '\033[31m',  # Red
                  '\033[32m',  # Green
                  '\033[33m',  # Yellow
                  '\033[34m',  # Blue
                  '\033[35m',  # Magenta
                  '\033[36m',  # Cyan
                  '\033[37m',  # White
