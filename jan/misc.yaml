              GREEN='\033[0;32m'
              YELLOW='\033[1;33m'
              BLUE='\033[0;34m'
              MAGENTA='\033[0;35m'
              CYAN='\033[0;36m'
              WHITE='\033[1;37m'
              GRAY='\033[0;37m'
              BOLD='\033[1m'
              UNDERLINE='\033[4m'
              RESET='\033[0m'

