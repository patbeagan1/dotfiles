  issue:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              issue

              A script for automated tasks.

              Requires on host: gh, jq, fzf

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'zsh'
            - '-c'
            - |
              # ==============================================================================
              # A Zsh CLI note-taking application using gh issues as the backend.
              # Assumes the current directory is the repository for notes.
              #
              # For a **git-branch filesystem** issue store (UUID ids, works from monorepo
              # subfolders, optional fzf/$EDITOR flows), use the Rust tool in this repo:
              #   filesystem-git-issues --help
              # It mirrors many of the verbs here (create, list, view, close, comment, label,
              # close-with-commit) while storing data on an `issues` branch instead of GitHub.
              # ==============================================================================

              # ------------------------------------------------------------------------------
              # Configuration: Edit these variables to match your setup.
              # ------------------------------------------------------------------------------

              # The label used to identify notes. This helps separate your notes
              # from other issues in the repository. Make sure this label exists.
              NOTE_LABEL="note-app"

              # ------------------------------------------------------------------------------
              # Helper functions
              # ------------------------------------------------------------------------------

              # Get the user's preferred editor, or default to vim
              EDITOR="${EDITOR:-nvim}"

              # Function for error handling
              _error() {
                echo "Error: $1" >&2
                exit 1
              }

              # Function to get note body via the user's editor
              _get_body_from_editor() {
                local temp_file=$(mktemp)
                local initial_body="$1"

                echo "$initial_body" > "$temp_file"

                "$EDITOR" "$temp_file" < `tty` > `tty`

                # Wait for the editor to close
                if ! [ $? -eq 0 ] ; then
                  _error "Editor failed. Aborting."
                fi

                cat "$temp_file"
                rm "$temp_file"
              }

              # Function to select a note using fzf
              _select_note_with_fzf() {
                local list_output
                list_output=$(gh issue list --state "open" \
                  --json number,title | jq -r '.[] | "\(.number) \(.title)"' | fzf)

                if [[ -z "$list_output" ]]; then
                  _error "No note selected."
                fi

                # Extract the issue number from the beginning of the line
                echo "$list_output" | awk '{print $1}'
              }

              # ------------------------------------------------------------------------------
              # Core functions for the note-taking app
              # ------------------------------------------------------------------------------

              # Function to create a new note
              create_note() {
                echo "Enter note title:"
                read -r title

                if [[ -z "$title" ]]; then
                  _error "Note title cannot be empty. Creation aborted."
                fi

                echo "Opening editor for note body. Save and exit to finish."
                body=$(_get_body_from_editor)

                echo "Creating note..."
                gh issue create --title "$title" --body "$body" --label "$NOTE_LABEL" > /dev/null
                if [[ "$?" -ne 0 ]]; then
                  _error "Failed to create note. Please check your repository and gh authentication."
                else
                  echo "Note created successfully."
                fi
              }

              # Function to list all notes
              list_notes() {
                local filter_label="$1"
                echo "Fetching issues from the current repository..."

                # Note: --limit 1000 is used to fetch up to 1000 issues, which is the current maximum supported by gh issue list.
                # See: https://www.mankier.com/1/gh-issue-list
                local args=("--state" "open" "--json" "number,title,labels" "--limit" "1000")
                if [[ -n "$filter_label" ]]; then
                  args+=("--label" "$filter_label")
                fi

                gh issue list "${args[@]}" | jq -r '.[] | "(\(.number)) \(.title) [\((.labels | map(.name) | join(", ")))]"'
              }

              # Function to view a specific note
              view_note() {
                local issue_number="$1"
                echo "Fetching note #$issue_number..."

                gh issue view "$issue_number" --json title,body | jq -r '
                  "Title: \(.title)\n---\n\n\(.body)\n"'
              }

              # Function to open a specific note in the browser
              open_note() {
                local issue_number="$1"
                echo "Opening note #$issue_number in the browser..."

                local url=$(gh issue view "$issue_number" --json url | jq -r '.url')

                # Use the correct command to open the URL based on the OS
                if [[ "$OSTYPE" == "darwin"* ]]; then
                  open "$url"
                elif [[ "$OSTYPE" == "linux-gnu"* ]]; then
                  xdg-open "$url"
                else
                  _error "Unsupported OS. Please open the following URL manually: $url"
                fi
              }

              # Function to edit a specific note
              edit_note() {
                local issue_number="$1"
                echo "Fetching note #$issue_number for editing..."

                local current_data=$(gh issue view "$issue_number" --json title,body)
                local current_title=$(echo "$current_data" | jq -r '.title')
                local current_body=$(echo "$current_data" | jq -r '.body')

                echo "Current title: $current_title"
                read -r "new_title?Enter new title (or press Enter to keep the current one): "

                if [[ -z "$new_title" ]]; then
                  new_title="$current_title"
                fi

                echo "Opening editor for the note body. Edit, save, and exit."
                local updated_body=$(_get_body_from_editor "$current_body")

                gh issue edit "$issue_number" --title "$new_title" --body "$updated_body" > /dev/null
                if [[ "$?" -ne 0 ]]; then
                  _error "Failed to update note #$issue_number."
                else
                  echo "Note #$issue_number updated successfully."
                fi
              }

              # Function to add a comment to a note
              comment_note() {
                local issue_number="$1"
                echo "Adding a comment to note #$issue_number."

                echo "Opening editor for your comment. Save and exit to submit."
                local comment_body=$(_get_body_from_editor)

                if [[ -z "$comment_body" ]]; then
                  _error "Comment body cannot be empty. Commenting aborted."
                fi

                gh issue comment "$issue_number" --body "$comment_body" > /dev/null
                if [[ "$?" -ne 0 ]]; then
                  _error "Failed to add comment to note #$issue_number."
                else
                  echo "Comment added to note #$issue_number successfully."
                fi
              }


              # Function to add labels to a note
              add_label() {
                local issue_number="$1"
                shift
                local labels=("$@")

                if [[ ${#labels[@]} -eq 0 ]]; then
                  _error "No labels provided. Usage: issue label <issue_number> <label1> [label2] ..."
                fi

                echo "Adding label(s) to note #$issue_number..."

                # Build the --add-label arguments
                local label_args=()
                for label in "${labels[@]}"; do
                  label_args+=("--add-label" "$label")
                done

                gh issue edit "$issue_number" "${label_args[@]}" > /dev/null
                if [[ "$?" -ne 0 ]]; then
                  _error "Failed to add label(s) to note #$issue_number."
                else
                  echo "Label(s) added to note #$issue_number successfully: ${labels[*]}"
                fi
              }

              # Function to "close" a note
              close_note() {
                local issue_number="$1"
                echo "Are you sure you want to close note #$issue_number? (y/N)"
                read -r confirmation

                if [[ "$confirmation" =~ ^[Yy]$ ]]; then
                  echo "Closing note #$issue_number..."
                  gh issue close "$issue_number"
                  if [[ "$?" -ne 0 ]]; then
                    _error "Failed to close note #$issue_number."
                  else
                    echo "Note #$issue_number closed successfully."
                  fi
                else
                  echo "Close canceled."
                fi
              }

              # Function to commit all changes and close an issue
              close_with_commit() {
                # Check if there are any changes to commit
                if git diff --quiet && git diff --cached --quiet; then
                  _error "No changes to commit. Please make some changes first."
                fi

                echo "Selecting issue to close with commit..."
                local issue_number=$(_select_note_with_fzf)
                [[ -z "$issue_number" ]] && exit 0

                echo "Fetching issue details for commit message..."
                local issue_data=$(gh issue view "$issue_number" --json title,url)
                local issue_title=$(echo "$issue_data" | jq -r '.title')
                local issue_url=$(echo "$issue_data" | jq -r '.url')

                if [[ -z "$issue_title" || -z "$issue_url" ]]; then
                  _error "Failed to fetch issue details for #$issue_number."
                fi

                echo "Enter commit message (or press Enter to use default):"
                echo "Default: Fix: $issue_title"
                read -r custom_message

                local commit_message
                if [[ -z "$custom_message" ]]; then
                  commit_message="Fix: $issue_title"
                else
                  commit_message="$custom_message"
                fi

                # Add the issue URL to the commit message
                commit_message="$commit_message

              Fixes: $issue_url"

                echo "Committing changes..."
                git add -A
                git commit -m "$commit_message"

                if [[ "$?" -ne 0 ]]; then
                  _error "Failed to commit changes. Issue will not be closed."
                fi

                local commit_hash=$(git rev-parse HEAD)
                local short_commit_hash=$(git rev-parse --short HEAD)

                echo "Commit successful! Adding commit reference to issue #$issue_number..."

                # Add commit hash as a comment to the issue
                local comment_body="🔧 Fixed in commit: $commit_hash"
                gh issue comment "$issue_number" --body "$comment_body" > /dev/null

                if [[ "$?" -ne 0 ]]; then
                  echo "Warning: Failed to add commit reference as comment to issue #$issue_number."
                else
                  echo "Added commit reference as comment to issue #$issue_number."
                fi

                echo "Closing issue #$issue_number..."
                gh issue close "$issue_number"

                if [[ "$?" -ne 0 ]]; then
                  echo "Warning: Commit was successful, but failed to close issue #$issue_number. You may need to close it manually."
                  exit 1
                else
                  echo "Issue #$issue_number closed successfully."
                  echo "Commit hash: $short_commit_hash"
                fi
              }

              # ------------------------------------------------------------------------------
              # Main script logic
              # ------------------------------------------------------------------------------

              # Check for required dependencies
              command -v gh >/dev/null 2>&1 || { _error "GitHub CLI (gh) is not installed."; }
              command -v jq >/dev/null 2>&1 || { _error "jq is not installed. Please install it."; }
              command -v fzf >/dev/null 2>&1 || { _error "fzf is not installed. Please install it."; }

              # Check for git repository
              if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
                  _error "Not in a git repository. Please run this script from inside the repository you want to use for notes."
              fi

              # Main command-line parser
              case "$1" in
                create)
                  create_note
                  ;;
                list)
                  shift
                  list_notes "$1"
                  ;;
                view)
                  shift
                  if [[ -z "$1" ]]; then
                    issue_number=$(_select_note_with_fzf)
                    [[ -z "$issue_number" ]] && exit 0 # Exit if fzf was cancelled
                    view_note "$issue_number"
                  else
                    view_note "$@"
                  fi
                  ;;
                open)
                  shift
                  if [[ -z "$1" ]]; then
                    issue_number=$(_select_note_with_fzf)
                    [[ -z "$issue_number" ]] && exit 0
                    open_note "$issue_number"
                  else
                    open_note "$@"
                  fi
                  ;;
                edit)
                  shift
                  if [[ -z "$1" ]]; then
                    issue_number=$(_select_note_with_fzf)
                    [[ -z "$issue_number" ]] && exit 0
                    edit_note "$issue_number"
                  else
                    edit_note "$@"
                  fi
                  ;;
                comment)
                  shift
                  if [[ -z "$1" ]]; then
                    issue_number=$(_select_note_with_fzf)
                    [[ -z "$issue_number" ]] && exit 0
                    comment_note "$issue_number"
                  else
                    comment_note "$@"
                  fi
                  ;;
                label)
                  shift
                  if [[ $# -eq 0 ]]; then
                    _error "No labels provided. Usage: issue label [<issue_number>] <label1> [label2] ..."
                  fi

                  # Check if first argument is a number (issue number) or a label
                  if [[ "$1" =~ ^[0-9]+$ ]]; then
                    issue_number="$1"
                    shift
                    if [[ $# -eq 0 ]]; then
                      _error "No labels provided. Usage: issue label [<issue_number>] <label1> [label2] ..."
                    fi
                    add_label "$issue_number" "$@"
                  else
                    # First argument is a label, need to select issue
                    issue_number=$(_select_note_with_fzf)
                    [[ -z "$issue_number" ]] && exit 0
                    add_label "$issue_number" "$@"
                  fi
                  ;;
                close)
                  shift
                  if [[ -z "$1" ]]; then
                    issue_number=$(_select_note_with_fzf)
                    [[ -z "$issue_number" ]] && exit 0
                    close_note "$issue_number"
                  else
                    close_note "$@"
                  fi
                  ;;
                closeWithCommit)
                  close_with_commit
                  ;;
                *)
                  echo "Usage: note <command> [arguments]"
                  echo ""
                  echo "Commands:"
                  echo "  create                Create a new note (opens editor)."
                  echo "  list [<label>]        List all open issues, optionally filtering by label."
                  echo "  view [<issue_number>] View a specific note. If no number is given, a selector will appear."
                  echo "  open [<issue_number>] Open a note in your web browser. If no number is given, a selector will appear."
                  echo "  edit [<issue_number>] Edit a specific note. If no number is given, a selector will appear."
                  echo "  comment [<issue_number>] Add a comment to a specific note. If no number is given, a selector will appear."
                  echo "  label [<issue_number>] <label1> [label2] ...  Add label(s) to a note. If no number is given, a selector will appear."
                  echo "  close [<issue_number>] Close a specific note. If no number is given, a selector will appear."
                  echo "  closeWithCommit       Commit all changes (like git commit -am) and close a selected issue."
                  ;;
              esac
          passthrough: true
