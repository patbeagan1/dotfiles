              for i in "${!party_colors[@]}"
              do
                magick convert -fill "${party_colors[i]}" -fuzz "${FUZZ}%" -opaque "${COLOR}" "${INPUTFILE}" temp$i.miff
              done

              cmd="magick convert -delay 4 -loop 0 -coalesce -layers OptimizeFrame "
              for i in "${!party_colors[@]}"
