  nz:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              nz

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'zsh'
            - '-c'
            - |
              # (c) 2022 Pat Beagan: MIT License
              set -euo pipefail

              nn () {
                  local nnfile="$NNFILE"

                  local prefix="notes-enc"
                  local bucket="s3://nn-note-bucket"
                  local notesRemoteArtifact="$bucket/$prefix.txt.gpg"
                  local notesLocalEnc="${HOME}/$prefix.txt.gpg"
                  local notesLocal="${HOME}/$prefix.txt"
                  local notesRemoteEnc="${HOME}/$prefix-remote.txt.gpg"
                  local notesRemote="${HOME}/$prefix-remote.txt"
                  local notesBak="${HOME}/$prefix-bak.txt"
                  local notesNew="${HOME}/$prefix-new.txt"

                  touch "$notesLocal"

                  function encrypt_notes () {
                      # encrypt notes
                      gpg \
                          --batch \
                          --yes \
                          --passphrase-file "$NNFILE" \
                          --output "$notesLocalEnc" \
                          -c "$notesLocal" 
                  }

                  function decrypt_notes () {
                       # decrypt notes
                      gpg \
                          --batch \
                          --yes \
                          --passphrase-file "$NNFILE" \
                          --output "$notesRemote" \
                          -d "$notesRemoteEnc" 
                  }

                  function combine_notes () {
                      # combine serverside and local notes
                      cat "$notesLocal" "$notesRemote" | sort | uniq > "$notesNew"

                      # backup current notes
                      mv "$notesLocal" "$notesBak"

                      # overwrite current notes with the combined notes
                      mv "$notesNew" "$notesLocal"

                      # printing differences
                      diff "$notesBak" "$notesLocal"
                  }

                  function usage () {
                      cat << EOF
              Usage: $0 [sync] <contents>

              If "sync" is the only argument to the script, 
                  it will attempt to synchronize the local list with the encrypted list on the server.

              If there are no arguments at all, 
                  the script will print out the contents of the local list.

              If there are any other arguments, 
                  they will be stored in the list located at '$notesLocal', with a timestamp.
              EOF
                  }

                  if [[ "help" == "$*" ]]
                  then
                      usage
                  elif [[ "sync" == "$*" ]]
                  then

                      # copy serverside notes to local
                      set +e
                      aws s3 cp "$notesRemoteArtifact" "$notesRemoteEnc" 

                      if [[ ! $? -eq 0 ]]; then
                          echo
                          echo "There was an issue with downloading the file."
                          echo "Does the file actually exist?"
                          echo
                          echo "Preparing a sample file to upload"
                          echo "..."

                          touch "$notesLocal"
                          encrypt_notes

                          echo
                          echo "Use the following command to put the initial file on the server."
                          echo "$ aws s3 cp $notesLocalEnc $bucket"
                          exit 1
                      fi	
                      set -e

                      decrypt_notes
                      combine_notes
                      encrypt_notes

                      # push the newly combined local notes to the server
                      aws s3 cp "$notesLocalEnc" "$bucket"

                  elif [ -n "$*" ]
                  then
                      echo $(date "+%y.%m.%d.%H.%M.%S") "$@" >> "$notesLocal"
                  else
                      cat "$notesLocal"
                  fi
              }

              nn "$*"
              trackusage "$0"
          passthrough: true
  oncron:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              oncron

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'python3'
            - '-c'
            - |
              import os
              import subprocess
              import datetime

              # Define a dictionary of cron expressions to bash commands
              cron_to_bash = {
                  '30 10 * * *': "echo 'This command runs every day at 10:30 AM' >> ~/cron.txt",
                  '0 18 * * *': "echo 'This command runs every day at 6:00 PM' >> ~/cron.txt",
                  '30 15 * * *': "echo 'This command runs every day at 6:00 PM' >> ~/cron.txt",
                  '* * * * *': "echo 'This command runs every minute' >> ~/cron.txt",
              }

              def execute_bash_command(command):
                  process = subprocess.Popen(command, stdout=subprocess.PIPE, shell=True)
                  output, error = process.communicate()
                  if error:
                      print(f"Error: {error}")
                  else:
                      print(f"Output: {output}")

              def parse_cron_expression(expression):
                  fields = expression.split()
                  return {
                      "minute": fields[0],
                      "hour": fields[1],
                      "day_of_month": fields[2],
                      "month": fields[3],
                      "day_of_week": fields[4],
                  }

              def cron_expression_matches_time(parsed_cron, dt):
                  minute_match = parsed_cron["minute"] == "*" or int(parsed_cron["minute"]) == dt.minute
                  hour_match = parsed_cron["hour"] == "*" or int(parsed_cron["hour"]) == dt.hour
                  day_of_month_match = parsed_cron["day_of_month"] == "*" or int(parsed_cron["day_of_month"]) == dt.day
                  month_match = parsed_cron["month"] == "*" or int(parsed_cron["month"]) == dt.month
                  day_of_week_match = parsed_cron["day_of_week"] == "*" or int(parsed_cron["day_of_week"]) == dt.weekday()

                  return minute_match and hour_match and day_of_month_match and month_match and day_of_week_match

              # Check if any cron expression matches the current time and execute the corresponding command
              now = datetime.datetime.now()
              for cron_expression, bash_command in cron_to_bash.items():
                  parsed_cron = parse_cron_expression(cron_expression)
                  if cron_expression_matches_time(parsed_cron, now):
                      execute_bash_command(bash_command)
          passthrough: true
