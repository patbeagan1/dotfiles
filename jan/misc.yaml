                      sys.stdout.write('\b')

              def stop_spinner():
                  sys.stdout.write('\b')
                  sys.stdout.flush()

              if __name__ == '__main__':
                  args = parse()
                  
                  if args.spinner:
                      spinner_thread = threading.Thread(target=start_spinner)
