# Personal utilities tree for jan (canonical under dotfiles/jan).
# Each category file inlines script `help` + `run` bodies.
# Multiline exec bodies use YAML literal block style (|).
about: misc utilities
commands:
  appletoast:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              appletoast

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'bash'
            - '-lc'
            - |
              # (c) 2022 Pat Beagan: MIT License

              appletoast () 
              { 
                  title="$1";
                  body="$2";
                  osascript -e 'on run {body, title}' -e 'display notification {body} with title {title}' -e 'end run' "$body" "$title"
              }
              appletoast "$@"
              trackusage "$0"
          passthrough: true
  apply-copyright-bash:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              apply-copyright-bash

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'zsh'
            - '-c'
            - |
              # (c) 2022 Pat Beagan: MIT License

              set -euo pipefail

              scriptname="$(basename "$0")"
              help() {
                  error_code=$?
                  echo "
              Usage: $scriptname [-h|--help]

              Adds copyright header to all bash shell scripts in the ./scripts directory.
              The copyright header will be inserted after the shebang line in each shell script.

              The copyright header added is:
              # (c) 2022 Pat Beagan: MIT License

              This script modifies files in place using sed.
              "
                  exit $error_code
              }

              main() {

                  emulate -L zsh
                  zmodload zsh/zutil || return 1

                  local help
                  zparseopts -D -F -K -- \
                      {h,-help}=help ||
                      return 1

                  if (($#help)); then help; fi

              apply-copyright-bash () {
              	find ./scripts -name "*" -type f -executable -exec sed -i '' 's/^#!\(.*\)/#!\1\n# \(c\) 2022 Pat Beagan: MIT License/' {} \;
              }

                  apply-copyright-bash "$@" || help
              }

              main "$@" || help
              trackusage "$0"
          passthrough: true
  apply-copyright-py:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              apply-copyright-py

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'zsh'
            - '-c'
            - |
              # (c) 2022 Pat Beagan: MIT License

              set -euo pipefail

              scriptname="$(basename "$0")"
              help() {
                  error_code=$?
                  echo "
              Usage: $scriptname [-h|--help]

              Adds copyright header to all Python scripts in the ./scripts directory.
              The copyright header will be inserted after the shebang line in each .py file.

              The copyright header added is:
              # (c) 2022 Pat Beagan: MIT License

              This script modifies files in place using sed.
              "
                  exit $error_code
              }

              main() {

                  emulate -L zsh
                  zmodload zsh/zutil || return 1

                  local help
                  zparseopts -D -F -K -- \
                      {h,-help}=help ||
                      return 1

                  if (($#help)); then help; fi

              apply-copyright-bash () {
              	find ./scripts -name "*.py" -type f -exec sed -i '' 's/^#!\(.*\)/#!\1\n# \(c\) 2022 Pat Beagan: MIT License/' {} \;
              }

                  apply-copyright-bash "$@" || help
              }

              main "$@" || help
              trackusage "$0"
          passthrough: true
  argnum:
