          passthrough: true
  cache:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              cache

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'zsh'
            - '-c'
            - |
              # (c) 2022 Pat Beagan: MIT License

              set -euo pipefail
              IFS=$'\n\t'

              help() {
                  error_code=$?
                  echo "
              Caches information from a given URL, at a given cache location. 
              The default cache location is ~/p-cache

              The script will return the location where the information is cached.
              Subsequent calls with the same address will skip downloading and just return the cache file name.
              "
                  if [[ ! $error_code -eq 0 ]]; then echo "Err: $error_code"; fi
              }

              function cache() {
                  if [ ! $# -eq 1 ]; then
                      return 1
                  fi
                  local cache_location="$HOME/p-cache"
                  local basename_original="$1"
                  local basename="$(sed 's/\//-/g' <(echo "$1"))"
                  local filename="$cache_location/$basename"
                  mkdir -p "$cache_location"

                  if [ -f "$filename" ]; then
                      echo "$filename"
                  else
                      wget \
                          --quiet \
                          -P "$cache_location" \
                          --continue \
                          -O "$filename" \
                          "$basename_original"
                      if [ $? -eq 0 ]; then
                          echo "$filename"
                      else
                          return 1
                      fi
                  fi
              }

              cache "$@" || help
              trackusage "$0"
          passthrough: true
  cbr-show:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              cbr-show

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'bash'
            - '-lc'
            - |
              set -euo pipefail
              node <<'JAN_CBR_EOF'
              const express = require('express');
              const fs = require('fs');
              const path = require('path');
              const JSZip = require('jszip');
              const app = express();

              const cbrDirectory = './'; // Use the current directory as the CBR directory

              const coverCache = new Map()
              async function checkCoverCache(key, defaultFn) {
                const value = coverCache.get[key]
                if (value) {
                  return value
                }
                const generatedValue = await defaultFn()
                coverCache.set(key, generatedValue)
                return generatedValue
              }

              app.get('/', async (req, res) => {
                const cbrFiles = getCbrFiles(cbrDirectory);
                const links = await Promise.all(cbrFiles.map(async (file) => await getLinkHTML(file)))

                const html = `
                  <html>
                    <head>
                      <title>CBR Viewer - Home</title>
                      <style>
                        .cbr-link {
                          display: flex;
                          flex-direction: column;
                          align-items: center;
                          text-align: center;
                          width: 200px;
                          margin: 10px;
                          padding: 10px;
                          border-radius: 10px;
                          background-color: #f5f5f5;
                          box-shadow: 0 2px 5px rgba(0,0,0,0.3);
                          text-decoration: none;
                          color: black;
                        }
                        .cbr-link img {
                          width: 100%;
                          max-height: 300px;
                          border-radius: 10px;
                          margin-bottom: 10px;
                        }
                        .display-filename {
                          overflow-wrap: anywhere;
                        }
                      </style>
                    </head>
                    <body>
                      <h1>CBR Viewer</h1>
                      <div style="display: flex; flex-wrap: wrap;">
                        ${links.join('')}
                      </div>
                    </body>
                  </html>
                `;
                res.send(html);
              });

              app.get('/cbrviewer/:fileName', async (req, res) => {
                try {
                  const cbrFileName = req.params.fileName;
                  const zip = await readZip(cbrFileName)

                  const images = await Promise.all(
                    findImageFileObjects(zip)
                      .map(async (entry) => {
                        return {
                          name: entry.name,
                          url: await getImageUrlFor(entry)
                        }
                      }));

                  images.sort((a, b) => {
                    const nameA = a.name.toUpperCase();
                    const nameB = b.name.toUpperCase();
                    if (nameA < nameB) {
                      return -1;
                    } else if (nameA > nameB) {
                      return 1;
                    } else {
                      return 0;
                    }
                  })

                  const html = `
                    <html>
                      <head>
                        <title>CBR Viewer - ${cbrFileName}</title>
                        <style>
                        #container {
                          display: flex;
                          justify-content: center;
                        }
                        #container > div {
                          width: 90%;
                        }
                        .cbr-image-container {
                          display: flex;
                          justify-content: center;
                        }
                        .cbr-image {
                          width: 100%;
                        }
                        </style>
                      </head>
                      <body>
                        <h1>${cbrFileName}</h1>
                        <div id="container">
                          <div>
                            ${images.map(each => `
                              <div class="cbr-image-container">
                                <img class="cbr-image" src="${each.url}">
                              </div>
                            `).join('')}
                          </div>
                        </div>
                      </body>
                    </html>
                  `;
                  res.send(html);
                } catch (error) {
                  console.error(error);
                  res.status(500).send('Error displaying CBR file');
                }
              });

              app.listen(3000, "0.0.0.0", () => console.log('Server started at http://0.0.0.0:3000'));

              async function getImageUrlFor(entry) {
                const type = entry.name.search(/.(\w)$/);
                const blob = await entry.async('base64');
                const url = `data:${type};base64,${blob}`;
                return url;
              }

              function getCbrFiles(directoryPath) {
                const files = fs.readdirSync(directoryPath);
                const cbrFiles = files.filter((file) => {
                  const extName = path.extname(file).toLowerCase();
                  const isCBR = extName === '.cbr';
                  const isCBZ = extName === '.cbz';
                  return isCBR || isCBZ;
                });
                return cbrFiles;
              }

              async function readZip(fileName) {
                const filePath = path.join(cbrDirectory, fileName);
                const zip = JSZip.loadAsync(fs.readFileSync(filePath));
                return zip
              }

              function findImageFileObjects(zipFile) {
                return zipFile.file(/.jpg|.JPG|.jpeg|.png/)
              }

              async function getLinkHTML(fileName) {
                const zip = readZip(fileName)
                return zip.then(async zipFile => {
                  try {
                    const entry = findImageFileObjects(zipFile)[0]
                    const url = await checkCoverCache(entry.name, () => getImageUrlFor(entry))
                    return `
                      <a href="/cbrviewer/${fileName}" class="cbr-link">
                        <img src="${url}">
                        <span class="display-filename">${fileName}</span>
                      </a>
                    `;
                  } catch (error) {
                    console.error(error)
                    return ""
                  }
                });
              }
              JAN_CBR_EOF
          passthrough: true
  check_program:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              check_program

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'python3'
            - '-c'
            - |
              import subprocess
              from concurrent.futures import ThreadPoolExecutor
              import argparse

              # Define a dictionary for package managers and their respective check commands
              pkg_managers = {
                  'brew': 'brew list',
                  'apt': 'apt list --installed',
                  'yum': 'yum list installed',
                  'dnf': 'dnf list --installed',
                  'zypper': 'zypper se --installed-only',
                  'pacman': 'pacman -Q',
                  'port': 'port installed',
                  'rpm': 'rpm -q',
                  'snap': 'snap list',
                  'flatpak': 'flatpak list',
                  'npm': 'npm list -g',
                  'cargo': 'cargo install --list',
                  'pip': 'pip show',
                  'pip3': 'pip3 show',
                  'gem': 'gem list --installed',
                  'pear': 'pear list',
                  'composer': 'composer show',
                  'nuget': 'dotnet nuget locals all --list',
                  'go': 'go list -m',
                  'conda': 'conda list'
              }

              def check_installed(manager, program):
                  """
                  Check if a program is installed using a specified package manager.

                  Args:
                  - manager: The package manager name.
                  - program: The program name to check.

                  Returns:
                  - The package manager name if the program is installed; otherwise, an empty string.
                  """
                  # try:
                  # Check if the package manager is available on the system
                  subprocess.run(manager, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True)

                  # Retrieve the command for the package manager
                  check_cmd = pkg_managers[manager]

                  # Execute the command to check if the program is installed
                  child = subprocess.Popen(f"{check_cmd} {program}", stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  print(child.stdout.read())

                  result = subprocess.run(f"{check_cmd} {program}", shell=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

                  if result.returncode == 0:
                      return manager
                  else:
                      return ''
                  # except (subprocess.CalledProcessError, KeyError, FileNotFoundError):
                  #     return ''

              def main(program):
                  """
                  Main function to check if a program is installed via various package managers.

                  Args:
                  - program: The program name to check.
                  """
                  print("Starting program check...")

                  # Run the checks in parallel
                  print("Running checks across various package managers...")
                  with ThreadPoolExecutor() as executor:
                      results = list(executor.map(check_installed, pkg_managers.keys(), [program] * len(pkg_managers)))

                  # Filter out empty strings and display the package managers that have the program installed
                  installed_pkg_managers = [pkg_managers[manager] for manager in results if manager]
                  print(f"Program {program} is installed via the following package managers:")
                  print("  "+ '\n  '.join(installed_pkg_managers) if installed_pkg_managers else f"Program {program} is not installed via known package managers or is not available.")

                  print("Check complete.")

              if __name__ == "__main__":
                  parser = argparse.ArgumentParser(description="Check if a program is installed via various package managers.")
                  parser.add_argument('program', type=str, help="The name of the program to check.")
                  args = parser.parse_args()

                  main(args.program)
          passthrough: true
