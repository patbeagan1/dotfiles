                      # Escape HTML specials in the URL for the href and in the display text
                      url_escaped=$(printf '%s' "$url" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')
                      printf '    <li><a href="%s">%s</a></li>\n' "$url_escaped" "$url_escaped"
