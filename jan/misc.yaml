              cat >"$tmpdir/_cbr-show" <<'JAN_EOF_cbr_show__cbr_show_87132d78100b'
              #compdef cbr-show

              # Zsh completion for cbr-show
              # Generated automatically - customize as needed

              _cbr-show() {
                  local context state line
                  typeset -A opt_args
                  
                  _arguments -C \
                      '(-h --help)'{-h,--help}'[Show help information]' \
                      '(-v --version)'{-v,--version}'[Show version information]' \
                      '*::arg:_files'
              }

              _cbr-show "$@"
              JAN_EOF_cbr_show__cbr_show_87132d78100b
              chmod +x "$tmpdir/_cbr-show" 2>/dev/null || true
              cat >"$tmpdir/cbr-show.js" <<'JAN_EOF_cbr_show_cbr_show_js_4f2c8045686b'
              const express = require('express');
              const fs = require('fs');
              const path = require('path');
              const JSZip = require('jszip');
              const app = express();

              const cbrDirectory = './'; // Use the current directory as the CBR directory

              const coverCache = new Map()
              async function checkCoverCache(key, defaultFn) {
                const value = coverCache.get[key]
                if (value) {
                  return value
                }
                const generatedValue = await defaultFn()
                coverCache.set(key, generatedValue)
                return generatedValue
              }

              app.get('/', async (req, res) => {
                const cbrFiles = getCbrFiles(cbrDirectory);
                const links = await Promise.all(cbrFiles.map(async (file) => await getLinkHTML(file)))

                const html = `
                  <html>
                    <head>
                      <title>CBR Viewer - Home</title>
                      <style>
                        .cbr-link {
                          display: flex;
                          flex-direction: column;
                          align-items: center;
                          text-align: center;
                          width: 200px;
                          margin: 10px;
                          padding: 10px;
                          border-radius: 10px;
                          background-color: #f5f5f5;
                          box-shadow: 0 2px 5px rgba(0,0,0,0.3);
                          text-decoration: none;
                          color: black;
                        }
                        .cbr-link img {
                          width: 100%;
                          max-height: 300px;
                          border-radius: 10px;
                          margin-bottom: 10px;
                        }
                        .display-filename {
                          overflow-wrap: anywhere;
                        }
                      </style>
                    </head>
                    <body>
                      <h1>CBR Viewer</h1>
                      <div style="display: flex; flex-wrap: wrap;">
                        ${links.join('')}
                      </div>
                    </body>
                  </html>
                `;
                res.send(html);
              });

              app.get('/cbrviewer/:fileName', async (req, res) => {
                try {
                  const cbrFileName = req.params.fileName;
                  const zip = await readZip(cbrFileName)

                  const images = await Promise.all(
                    findImageFileObjects(zip)
                      .map(async (entry) => {
                        return {
                          name: entry.name,
                          url: await getImageUrlFor(entry)
                        }
                      }));

                  images.sort((a, b) => {
                    const nameA = a.name.toUpperCase();
                    const nameB = b.name.toUpperCase();
                    if (nameA < nameB) {
                      return -1;
                    } else if (nameA > nameB) {
                      return 1;
                    } else {
                      return 0;
                    }
                  })

                  const html = `
                    <html>
                      <head>
                        <title>CBR Viewer - ${cbrFileName}</title>
                        <style>
                        #container {
                          display: flex;
                          justify-content: center;
                        }
                        #container > div {
                          width: 90%;
                        }
                        .cbr-image-container {
                          display: flex;
                          justify-content: center;
                        }
                        .cbr-image {
                          width: 100%;
                        }
                        </style>
                      </head>
                      <body>
                        <h1>${cbrFileName}</h1>
                        <div id="container">
                          <div>
                            ${images.map(each => `
                              <div class="cbr-image-container">
                                <img class="cbr-image" src="${each.url}">
                              </div>
                            `).join('')}
                          </div>
                        </div>
                      </body>
                    </html>
                  `;
                  res.send(html);
                } catch (error) {
                  console.error(error);
                  res.status(500).send('Error displaying CBR file');
                }
              });

              app.listen(3000, "0.0.0.0", () => console.log('Server started at http://0.0.0.0:3000'));

              async function getImageUrlFor(entry) {
                const type = entry.name.search(/.(\w)$/);
                const blob = await entry.async('base64');
                const url = `data:${type};base64,${blob}`;
                return url;
              }

              function getCbrFiles(directoryPath) {
                const files = fs.readdirSync(directoryPath);
                const cbrFiles = files.filter((file) => {
                  const extName = path.extname(file).toLowerCase();
                  const isCBR = extName === '.cbr';
                  const isCBZ = extName === '.cbz';
                  return isCBR || isCBZ;
                });
                return cbrFiles;
              }

              async function readZip(fileName) {
                const filePath = path.join(cbrDirectory, fileName);
                const zip = JSZip.loadAsync(fs.readFileSync(filePath));
                return zip
              }

              function findImageFileObjects(zipFile) {
                return zipFile.file(/.jpg|.JPG|.jpeg|.png/)
              }

              async function getLinkHTML(fileName) {
                const zip = readZip(fileName)
                return zip.then(async zipFile => {
                  try {
                    const entry = findImageFileObjects(zipFile)[0]
                    const url = await checkCoverCache(entry.name, () => getImageUrlFor(entry))
                    return `
                      <a href="/cbrviewer/${fileName}" class="cbr-link">
                        <img src="${url}">
                        <span class="display-filename">${fileName}</span>
                      </a>
                    `;
                  } catch (error) {
                    console.error(error)
                    return ""
                  }
                });
              }
              JAN_EOF_cbr_show_cbr_show_js_4f2c8045686b
              chmod +x "$tmpdir/cbr-show.js" 2>/dev/null || true
              cat >"$tmpdir/cbr-show.sh" <<'JAN_EOF_cbr_show_cbr_show_sh_cdc86ea71e2b'
              #!/usr/bin/env zsh

              node $(dirname "$0")/_cbr-show/cbr-show.js
              JAN_EOF_cbr_show_cbr_show_sh_cdc86ea71e2b
              chmod +x "$tmpdir/cbr-show.sh" 2>/dev/null || true
              cd "$tmpdir"
              exec "$tmpdir/cbr-show.sh" "$@"
          passthrough: true
