              #compdef issue

              # Zsh completion for issue script
              # Place this file in your $fpath (e.g., ~/.local/share/zsh/completions/ or /usr/local/share/zsh/site-functions/)

              _issue() {
                local context state line
                typeset -A opt_args

                _arguments \
                  '1: :->command' \
                  '*: :->args' \
                  && return 0

                case $state in
                  command)
                    local commands=(
                      'create:Create a new note (opens editor)'
                      'list:List all open issues, optionally filtering by label'
                      'view:View a specific note'
                      'open:Open a note in your web browser'
                      'edit:Edit a specific note'
                      'comment:Add a comment to a specific note'
                      'label:Add label(s) to a note'
                      'close:Close a specific note'
                      'closeWithCommit:Commit all changes and close a selected issue'
                    )
                    _describe 'commands' commands
                    ;;
                  args)
                    case $line[1] in
                      list)
                        # For list command, provide label completion
                        _issue_labels
                        ;;
                      view|open|edit|comment|close)
                        # For commands that take issue numbers, provide issue number completion
                        _issue_numbers
                        ;;
                      label)
                        # For label command, provide issue number completion first, then label completion
                        # This is a bit tricky - we need to handle both issue number and labels
                        # For now, provide issue number completion
                        _issue_numbers
                        ;;
                      create|closeWithCommit)
                        # These commands don't take arguments
                        ;;
                    esac
                    ;;
                esac
              }

              # Function to complete issue numbers
              _issue_numbers() {
                local issues
                local issue_list
                
                # Check if we're in a git repository and have gh CLI available
                if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
                  return 1
                fi
                
                if ! command -v gh >/dev/null 2>&1; then
                  return 1
                fi
                
                # Get issue numbers and titles for completion
                # Using the same approach as the script with --limit 1000
                issue_list=$(gh issue list --state open --json number,title --limit 1000 2>/dev/null | \
                  jq -r '.[] | "\(.number):\(.title)"' 2>/dev/null)
                
                if [[ -n "$issue_list" ]]; then
                  local -a issues_array
                  while IFS= read -r line; do
                    if [[ -n "$line" ]]; then
                      issues_array+=("$line")
                    fi
                  done <<< "$issue_list"
                  
                  _describe 'issues' issues_array
                fi
              }

              # Function to complete labels
              _issue_labels() {
                local labels
                local label_list
                
                # Check if we're in a git repository and have gh CLI available
                if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
                  return 1
                fi
                
                if ! command -v gh >/dev/null 2>&1; then
                  return 1
                fi
                
                # Get available labels from the repository
                label_list=$(gh label list --json name 2>/dev/null | \
                  jq -r '.[].name' 2>/dev/null)
                
                if [[ -n "$label_list" ]]; then
                  local -a labels_array
                  while IFS= read -r line; do
                    if [[ -n "$line" ]]; then
                      labels_array+=("$line")
                    fi
                  done <<< "$label_list"
                  
                  _describe 'labels' labels_array
                fi
              }

              # Main completion function
              _issue "$@"
              JAN_EOF_issue__issue_588b28642dcf
              chmod +x "$tmpdir/_issue" 2>/dev/null || true
              cat >"$tmpdir/issue.zsh" <<'JAN_EOF_issue_issue_zsh_8bbc8048066d'
              #!/usr/bin/env zsh

              # ==============================================================================
              # A Zsh CLI note-taking application using gh issues as the backend.
              # Assumes the current directory is the repository for notes.
              #
              # For a **git-branch filesystem** issue store (UUID ids, works from monorepo
              # subfolders, optional fzf/$EDITOR flows), use the Rust tool in this repo:
              #   filesystem-git-issues --help
              # It mirrors many of the verbs here (create, list, view, close, comment, label,
              # close-with-commit) while storing data on an `issues` branch instead of GitHub.
              # ==============================================================================

              # ------------------------------------------------------------------------------
              # Configuration: Edit these variables to match your setup.
              # ------------------------------------------------------------------------------

              # The label used to identify notes. This helps separate your notes
              # from other issues in the repository. Make sure this label exists.
              NOTE_LABEL="note-app"

              # ------------------------------------------------------------------------------
              # Helper functions
              # ------------------------------------------------------------------------------

              # Get the user's preferred editor, or default to vim
              EDITOR="${EDITOR:-nvim}"

              # Function for error handling
              _error() {
                echo "Error: $1" >&2
                exit 1
              }

              # Function to get note body via the user's editor
              _get_body_from_editor() {
                local temp_file=$(mktemp)
                local initial_body="$1"

                echo "$initial_body" > "$temp_file"
                
                "$EDITOR" "$temp_file" < `tty` > `tty`
                
                # Wait for the editor to close
                if ! [ $? -eq 0 ] ; then
                  _error "Editor failed. Aborting."
                fi
                
                cat "$temp_file"
                rm "$temp_file"
              }

              # Function to select a note using fzf
              _select_note_with_fzf() {
                local list_output
                list_output=$(gh issue list --state "open" \
                  --json number,title | jq -r '.[] | "\(.number) \(.title)"' | fzf)
                
                if [[ -z "$list_output" ]]; then
                  _error "No note selected."
                fi
                
                # Extract the issue number from the beginning of the line
                echo "$list_output" | awk '{print $1}'
              }

              # ------------------------------------------------------------------------------
              # Core functions for the note-taking app
              # ------------------------------------------------------------------------------

              # Function to create a new note
              create_note() {
                echo "Enter note title:"
                read -r title
                
                if [[ -z "$title" ]]; then
                  _error "Note title cannot be empty. Creation aborted."
                fi

                echo "Opening editor for note body. Save and exit to finish."
                body=$(_get_body_from_editor)
                
                echo "Creating note..."
                gh issue create --title "$title" --body "$body" --label "$NOTE_LABEL" > /dev/null
                if [[ "$?" -ne 0 ]]; then
                  _error "Failed to create note. Please check your repository and gh authentication."
                else
                  echo "Note created successfully."
                fi
              }

              # Function to list all notes
              list_notes() {
                local filter_label="$1"
                echo "Fetching issues from the current repository..."

                # Note: --limit 1000 is used to fetch up to 1000 issues, which is the current maximum supported by gh issue list.
                # See: https://www.mankier.com/1/gh-issue-list
                local args=("--state" "open" "--json" "number,title,labels" "--limit" "1000")
                if [[ -n "$filter_label" ]]; then
                  args+=("--label" "$filter_label")
                fi

                gh issue list "${args[@]}" | jq -r '.[] | "(\(.number)) \(.title) [\((.labels | map(.name) | join(", ")))]"'
              }

              # Function to view a specific note
              view_note() {
                local issue_number="$1"
                echo "Fetching note #$issue_number..."

                gh issue view "$issue_number" --json title,body | jq -r '
                  "Title: \(.title)\n---\n\n\(.body)\n"'
              }

              # Function to open a specific note in the browser
              open_note() {
                local issue_number="$1"
                echo "Opening note #$issue_number in the browser..."
                
                local url=$(gh issue view "$issue_number" --json url | jq -r '.url')
                
                # Use the correct command to open the URL based on the OS
                if [[ "$OSTYPE" == "darwin"* ]]; then
                  open "$url"
                elif [[ "$OSTYPE" == "linux-gnu"* ]]; then
                  xdg-open "$url"
                else
                  _error "Unsupported OS. Please open the following URL manually: $url"
                fi
              }

              # Function to edit a specific note
              edit_note() {
                local issue_number="$1"
                echo "Fetching note #$issue_number for editing..."
                
                local current_data=$(gh issue view "$issue_number" --json title,body)
                local current_title=$(echo "$current_data" | jq -r '.title')
                local current_body=$(echo "$current_data" | jq -r '.body')

                echo "Current title: $current_title"
                read -r "new_title?Enter new title (or press Enter to keep the current one): "
                
                if [[ -z "$new_title" ]]; then
                  new_title="$current_title"
                fi
                
                echo "Opening editor for the note body. Edit, save, and exit."
                local updated_body=$(_get_body_from_editor "$current_body")
                
                gh issue edit "$issue_number" --title "$new_title" --body "$updated_body" > /dev/null
                if [[ "$?" -ne 0 ]]; then
                  _error "Failed to update note #$issue_number."
                else
                  echo "Note #$issue_number updated successfully."
                fi
              }

              # Function to add a comment to a note
              comment_note() {
                local issue_number="$1"
                echo "Adding a comment to note #$issue_number."

                echo "Opening editor for your comment. Save and exit to submit."
                local comment_body=$(_get_body_from_editor)

                if [[ -z "$comment_body" ]]; then
                  _error "Comment body cannot be empty. Commenting aborted."
                fi

                gh issue comment "$issue_number" --body "$comment_body" > /dev/null
                if [[ "$?" -ne 0 ]]; then
                  _error "Failed to add comment to note #$issue_number."
                else
                  echo "Comment added to note #$issue_number successfully."
                fi
              }


              # Function to add labels to a note
              add_label() {
                local issue_number="$1"
                shift
                local labels=("$@")
                
                if [[ ${#labels[@]} -eq 0 ]]; then
                  _error "No labels provided. Usage: issue label <issue_number> <label1> [label2] ..."
                fi
                
                echo "Adding label(s) to note #$issue_number..."
                
                # Build the --add-label arguments
                local label_args=()
                for label in "${labels[@]}"; do
                  label_args+=("--add-label" "$label")
                done
                
                gh issue edit "$issue_number" "${label_args[@]}" > /dev/null
                if [[ "$?" -ne 0 ]]; then
                  _error "Failed to add label(s) to note #$issue_number."
                else
                  echo "Label(s) added to note #$issue_number successfully: ${labels[*]}"
                fi
              }

              # Function to "close" a note
              close_note() {
                local issue_number="$1"
                echo "Are you sure you want to close note #$issue_number? (y/N)"
                read -r confirmation
                
                if [[ "$confirmation" =~ ^[Yy]$ ]]; then
                  echo "Closing note #$issue_number..."
                  gh issue close "$issue_number"
                  if [[ "$?" -ne 0 ]]; then
                    _error "Failed to close note #$issue_number."
                  else
                    echo "Note #$issue_number closed successfully."
                  fi
                else
                  echo "Close canceled."
                fi
              }

              # Function to commit all changes and close an issue
              close_with_commit() {
                # Check if there are any changes to commit
                if git diff --quiet && git diff --cached --quiet; then
                  _error "No changes to commit. Please make some changes first."
                fi

