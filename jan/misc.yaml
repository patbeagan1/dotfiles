              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - bash
            - '-lc'
            - |
              set -euo pipefail
              tmpdir="$(mktemp -d)"
              trap 'rm -rf "$tmpdir"' EXIT
              cat >"$tmpdir/_cache" <<'JAN_EOF_cache__cache_a9b16b99bc21'
              #compdef cache

              # Zsh completion for cache
              # Generated automatically - customize as needed

              _cache() {
                  local context state line
                  typeset -A opt_args
                  
                  _arguments -C \
                      '(-h --help)'{-h,--help}'[Show help information]' \
                      '(-v --version)'{-v,--version}'[Show version information]' \
                      '*::arg:_files'
              }

              _cache "$@"
              JAN_EOF_cache__cache_a9b16b99bc21
              chmod +x "$tmpdir/_cache" 2>/dev/null || true
              cat >"$tmpdir/cache.sh" <<'JAN_EOF_cache_cache_sh_106777727c19'
              #!/usr/bin/env zsh
              # (c) 2022 Pat Beagan: MIT License

              set -euo pipefail
              IFS=$'\n\t'

              help() {
                  error_code=$?
                  echo "
              Caches information from a given URL, at a given cache location. 
              The default cache location is ~/p-cache

              The script will return the location where the information is cached.
              Subsequent calls with the same address will skip downloading and just return the cache file name.
              "
                  if [[ ! $error_code -eq 0 ]]; then echo "Err: $error_code"; fi
              }

              function cache() {
                  if [ ! $# -eq 1 ]; then
                      return 1
                  fi
                  local cache_location="$HOME/p-cache"
                  local basename_original="$1"
                  local basename="$(sed 's/\//-/g' <(echo "$1"))"
                  local filename="$cache_location/$basename"
                  mkdir -p "$cache_location"

                  if [ -f "$filename" ]; then
                      echo "$filename"
                  else
                      wget \
                          --quiet \
                          -P "$cache_location" \
                          --continue \
                          -O "$filename" \
                          "$basename_original"
                      if [ $? -eq 0 ]; then
                          echo "$filename"
                      else
                          return 1
                      fi
                  fi
              }

              cache "$@" || help
              trackusage "$0"
              JAN_EOF_cache_cache_sh_106777727c19
              chmod +x "$tmpdir/cache.sh" 2>/dev/null || true
              cd "$tmpdir"
              exec "$tmpdir/cache.sh" "$@"
          passthrough: true
  cbr-show:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
