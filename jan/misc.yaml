              function splitBashCommand(bashCommand) {
                  const regex = /(?:[^\s"']+|"[^"]*"|'[^']*')+/g;
                  const args = bashCommand.match(regex) || [];
                  return args;
                }
                
                function joinArgsWithBackslashNewline(args) {
                  const result = args.reduce((acc, arg, index) => {
                    if (arg === '|') {
                      return acc.trim() + ' \\\n  ' + arg;
                    }
                    if (index > 0 && args[index - 1] === '|') {
