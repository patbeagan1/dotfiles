              while [[ $# -gt 1 ]]
              do
              key="$1"
                case $key in
                -i|--input-file)
                INPUTFILE=$2
                shift
                ;;
                -c|--color)
                COLOR=$2
                shift
                ;;
                -f|--fuzz)
                FUZZ=$2
                shift
                ;;
                -o|--output-file)
                OUTPUTFILE=$2
                shift
