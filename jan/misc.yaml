  variance:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              variance

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'bash'
            - '-lc'
            - |
              # (c) 2022 Pat Beagan: MIT License

              variance () 
              { 
                  math $(sum $(echo $(for i in $(echo "$1" | tr ',' ' '); do math $(math $i-$(mean "$1"))^2; done) | tr ' ' ',')) / $(count_list "$1")
              }

              variance "$@"
              trackusage "$0"
          passthrough: true
  wiki:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              wiki

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'deno'
            - 'eval'
            - '--ext=ts'
            - |
              let url = 'https://en.wikipedia.org/w/api.php'

              const params = {
                action: 'query',
                format: 'json',
                titles: Deno.args.join(" "),
                prop: 'info',
                inprop: 'url|talkid'
              }

              url = url + '?origin=*'

              Object
                .keys(params)
                .forEach((key) => {
                  url += '&' + key + '=' + params[key]
                })

              const getPageUrlByCurrId = (curid) => {
                return `http://en.wikipedia.org/?curid=${curid}`
              }

              fetch(url)
                .then((response) => response.json())
                .then((response) => {
                  const pages = Object.values(
                    response.query.pages
                  )
                  pages.forEach((it) => {
                    console.log(`${getPageUrlByCurrId(it.pageid)}`)
                  })
                })
                .catch((error) => console.log(error))

              /*
