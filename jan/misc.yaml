                  exit 1
              fi

              # Default values
              MODEL="text-davinci-003"
              MAX_TOKENS=100

              # Usage message
              usage() {
                  echo "Usage: $0 -p <prompt> [-m <model>] [-t <max_tokens>]" >&2
              }

              # Parse command-line options
              while getopts ":p:m:t:" opt; do
                  case "$opt" in
