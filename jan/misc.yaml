  dota-timer:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              dota-timer

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'bash'
            - '-lc'
            - |
              # Function to handle text-to-speech based on the operating system
              text_to_speech() {
                  local message=$1
                  echo "$message"
                  if [[ "$OSTYPE" == "darwin"* ]]; then
                      say "$message"
                  elif [[ "$OSTYPE" == "linux-gnu"* ]]; then
                      spd-say "$message"
                  elif [[ "$OSTYPE" == "msys" || "$OSTYPE" == "cygwin" || "$OSTYPE" == "win32" ]]; then
                      powershell -Command "Add-Type -AssemblyName System.speech; \$speak = New-Object System.Speech.Synthesis.SpeechSynthesizer; \$speak.Speak('$message')"
                  else
                      echo "Text-to-speech not supported on this OS."
                  fi
              }

              # Function to announce an event after a delay
              announce_event() {
                  local delay=$1
                  local message=$2
                  sleep $delay
                  text_to_speech "$message"
              }

              # Main function to start the timer
              start_dota_timer() {
                  echo "Starting Dota timer..."

                  # Day/Night cycle events (every 5 minutes)
                  for i in {1..12}; do
                      local time=$((i * 300 + 5))
                      if ((i % 2 == 1)); then
                          announce_event $time "Daytime. $((i / 2 + 1)) minutes remaining until night." &
                      else
                          announce_event $time "Nighttime. $((i / 2)) minutes remaining until day." &
                      fi
                  done

                  # Neutral creep spawn times (every minute starting at 1:00)
                  for i in {1..60}; do
                      announce_event $((i * 60 + 2)) "Neutral creeps have spawned." &
                  done

                  # Other important events
                  announce_event 0 "Welcome to Dota 2!" &
                  announce_event 10 "10 seconds have passed." &
                  announce_event 60 "1 minute mark. Check runes!" &
                  announce_event 240 "4 minute mark. Power runes will spawn soon." &
                  announce_event 300 "5 minute mark. Siege creeps will spawn soon. Bounty runes are available!" &
                  announce_event 480 "8 minute mark. Check Roshan soon for potential respawn." &
                  announce_event 600 "10 minute mark. Outposts are available!" &
                  announce_event 720 "12 minute mark. Power runes will spawn soon." &
                  announce_event 900 "15 minute mark. Siege creeps will spawn soon. Check runes!" &

                  # Wait for all events to complete
                  wait
                  echo "Dota timer finished."
              }

              # Start the timer
              start_dota_timer
          passthrough: true
  double_revert:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              double_revert

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'zsh'
            - '-c'
            - |
              # Usage: ./double_revert <commit_hash>

              # Check for commit hash
              if [ -z "$1" ]; then
                echo "Usage: $0 <commit_hash>"
                exit 1
              fi

              COMMIT_HASH=$1

              # Revert the original commit
              echo "Reverting commit: $COMMIT_HASH"
              git revert --no-edit $COMMIT_HASH
              if [ $? -ne 0 ]; then
                echo "Failed to revert $COMMIT_HASH"
                exit 1
              fi

              # Get the hash of the revert commit (the latest commit now)
              REVERT_COMMIT=$(git rev-parse HEAD)

              # Revert the revert commit
              echo "Reverting the revert commit: $REVERT_COMMIT"
              git revert --no-edit $REVERT_COMMIT
              if [ $? -ne 0 ]; then
                echo "Failed to revert the revert commit $REVERT_COMMIT"
                exit 1
              fi

              echo "Done. Two commits created, no net changes."
          passthrough: true
  dsl_xml_converter:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              dsl_xml_converter

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'python3'
            - '-c'
            - |
              import argparse
              import re
              import xml.etree.ElementTree as ET
              from xml.dom import minidom

              # -------- DSL to XML --------


              def parse_attributes(attr_string):
                  attrs = {}
                  if attr_string:
                      attr_pairs = re.findall(r'(\w+)\s*=\s*("[^"]*"|\d+|\w+)', attr_string)
                      for key, value in attr_pairs:
                          if not (value.startswith('"') and value.endswith('"')):
                              value = f'"{value}"'
                          attrs[key] = value
                  return attrs


              def dsl_to_xml(lines, indent_level=0):
                  xml = ""
                  indent = "  " * indent_level

                  while lines:
                      line = lines.pop(0).strip()
                      if not line:
                          continue

                      if line.startswith("#"):
                          xml += f"{indent}<!-- {line[1:].strip()} -->\n"
                          continue

                      if re.match(r"^CDATA\s*\{", line):
                          cdata_content = ""
                          while lines:
                              l = lines.pop(0).strip()
                              if l == "}":
                                  break
                              match = re.match(r'"(.*)"', l)
                              if match:
                                  cdata_content += match.group(1)
                          xml += f"{indent}<![CDATA[{cdata_content}]]>\n"
                          continue

                      match = re.match(r"(\w+)\s*(\([^)]*\))?\s*(\{)?$", line)
                      if match:
                          tag = match.group(1)
                          attr_str = match.group(2)
                          has_block = match.group(3) == "{"
                          attrs = parse_attributes(attr_str[1:-1] if attr_str else "")
                          attr_xml = (
                              " " + " ".join(f"{k}={v}" for k, v in attrs.items()) if attrs else ""
                          )

                          if has_block:
                              xml += f"{indent}<{tag}{attr_xml}>\n"
                              xml += dsl_to_xml(lines, indent_level + 1)
                              xml += f"{indent}</{tag}>\n"
                          else:
                              xml += f"{indent}<{tag}{attr_xml} />\n"
                          continue

                      if line == "}":
                          return xml

                      match = re.match(r'"(.*)"', line)
                      if match:
                          xml += f"{indent}{match.group(1)}\n"
                      else:
                          xml += f"{indent}{line}\n"

                  return xml


              def validate_dsl_syntax(dsl_string):
                  stack = []
                  in_quote = False
                  for i, char in enumerate(dsl_string):
                      if char == '"':
                          in_quote = not in_quote
                      elif not in_quote:
                          if char == "{":
                              stack.append("{")
                          elif char == "}":
                              if not stack or stack.pop() != "{":
                                  return False, f"Unmatched closing brace at position {i}"
                  if in_quote:
                      return False, "Unclosed quotation mark"
                  if stack:
                      return False, "Unclosed brace(s)"
                  return True, "DSL syntax is valid"


              def validate_xml(xml_string):
                  try:
                      ET.fromstring(f"<root>{xml_string}</root>")
                      return True, "XML is valid"
                  except ET.ParseError as e:
                      return False, f"XML Parse Error: {e}"


              # -------- XML to DSL --------


              def xml_to_dsl(elem, indent_level=0):
                  indent = "  " * indent_level
                  dsl = ""

                  # Skip root wrapper if present
                  if elem.tag == "root":
                      for child in elem:
                          dsl += xml_to_dsl(child, indent_level)
                      return dsl

                  attrs = elem.attrib
                  attr_str = (
                      "(" + ", ".join(f"{k}={repr(v)}" for k, v in attrs.items()) + ")"
                      if attrs
                      else ""
                  )

                  children = list(elem)
                  has_text = elem.text and elem.text.strip()

                  if not children and has_text:
                      dsl += f"{indent}{elem.tag}{attr_str} {{"
                      dsl += f' "{elem.text.strip()}"'
                      dsl += f"}}\n"

                  elif children or has_text:
                      dsl += f"{indent}{elem.tag}{attr_str} {{\n"
                      if has_text:
                          dsl += f'{indent}  "{elem.text.strip()}"\n'

                      for child in children:
                          if isinstance(child.tag, str):
                              dsl += xml_to_dsl(child, indent_level + 1)
                          elif child.tag is ET.Comment:
                              dsl += f"{indent}  # {child.text.strip()}\n"

                      dsl += f"{indent}}}\n"
                  else:
                      dsl += f"{indent}{elem.tag}{attr_str}()\n"

                  return dsl


              def replacer(match):
                  print("replace")
                  prefix = match.group(1)
                  inner = match.group(2)
                  return f"{prefix} {{\n  {inner.strip()}\n}}"


              def expand_single_line_blocks(dsl_code: str) -> str:
                  """
                  Replaces single-line DSL blocks like `something { foo() }` with:
                      something {
                          foo()
                      }
                  Only applies to blocks fully contained on a single line.
                  """
                  pattern = re.compile(r"\s*(\w+\s*\(?[^\)]*\)?\s*)\{\s*(.*?)\s*\}")
                  print("expand")

                  new_var = pattern.sub(replacer, dsl_code)
                  print("expandAfter: " + new_var)
                  return new_var


              # -------- Main Entrypoint --------


              def main():
                  parser = argparse.ArgumentParser(description="Convert between DSL and XML.")
                  parser.add_argument(
                      "--dsl2xml",
                      nargs=2,
                      metavar=("input.dsl", "output.xml"),
                      help="Convert DSL to XML",
                  )
                  parser.add_argument(
                      "--xml2dsl",
                      nargs=2,
                      metavar=("input.xml", "output.dsl"),
                      help="Convert XML to DSL",
                  )
                  args = parser.parse_args()

                  if args.dsl2xml:
                      in_file, out_file = args.dsl2xml
                      with open(in_file, "r") as f:
                          dsl_input = f.read()

                      valid_dsl, msg = validate_dsl_syntax(dsl_input)
                      if not valid_dsl:
                          print("Error:", msg)
                          return

                      # replace single line dsl functions with multiline ones
                      lines = [expand_single_line_blocks(it) for it in dsl_input.strip().splitlines()]

                      xml_output = dsl_to_xml(lines)
                      pretty_xml = minidom.parseString(f"<root>{xml_output}</root>").toprettyxml(
                          indent="  "
                      )
                      with open(out_file, "w") as f:
                          f.write(pretty_xml.replace("<root>", "").replace("</root>", "").strip())
                      print(f"Converted DSL → XML: {out_file}")

                  elif args.xml2dsl:
                      in_file, out_file = args.xml2dsl
                      tree = ET.parse(in_file)
                      root = tree.getroot()
                      dsl_output = xml_to_dsl(root)
                      with open(out_file, "w") as f:
                          f.write(dsl_output)
                      print(f"Converted XML → DSL: {out_file}")

                  else:
                      parser.print_help()


              if __name__ == "__main__":
                  main()
          passthrough: true
