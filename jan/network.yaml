                      if (prevSiteIndex === -1) prevSiteIndex = 0;
                      let nextSiteIndex = thisSite + 1;

                      const cp = `<p>
                          <a href="/${prevSiteIndex}.html">[Prev]</a> |
                          <a href="/${nextSiteIndex}.html">[Next]</a>
                      </p>`;

                      this.shadowRoot
                          .querySelector("#webring-copy")
                          .insertAdjacentHTML("afterbegin", cp);
