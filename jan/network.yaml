              chmod +x "$tmpdir/_scan-lan" 2>/dev/null || true
              cat >"$tmpdir/scan-lan.sh" <<'JAN_EOF_scan_lan_scan_lan_sh_fc93a7b6b9a3'
              #!/usr/bin/env zsh

              set -euo pipefail

              scriptname="$(basename "$0")"
              help() {
                  error_code=$?
                  echo "
              Usage: $scriptname [-h|--help]

              Scans the local network (192.168.1.0/24) for active hosts using parallel ping.
              Shows all responding hosts and displays your own IP address.

              Features:
                - Parallel scanning with 128 concurrent processes
                - Scans entire 192.168.1.0/24 subnet
                - Shows only responding hosts
                - Displays your own IP address at the end
                - Fast scanning with 2-second timeout per host

              Examples:
                $scriptname          # Scans local network and shows active hosts
              "
                  exit $error_code
              }

              main() {

                  emulate -L zsh
                  zmodload zsh/zutil || return 1

                  local help
                  zparseopts -D -F -K -- \
                      {h,-help}=help ||
                      return 1

                  if (($#help)); then help; fi

              scan-lan () {
              	echo
              	parallel \
              		-P 128 \
              		'ping -nqc 1 -W 2 192.168.1.{} \
              		| sed -z "s/\n//g" \
              		| uniq \
              		| grep -v "0 received" \
              		| sed -e "s/---/\n/g" \
              		| grep PING \
              		2> /dev/null \
              		' ::: {0..255} \
              		| cut -d' ' -f2 \
              		| sort
              	echo
              	echo "I am `pretty_ip`"
              }

                  scan-lan "$@" || help
              }

              main "$@" || help
              trackusage "$0"
              JAN_EOF_scan_lan_scan_lan_sh_fc93a7b6b9a3
              chmod +x "$tmpdir/scan-lan.sh" 2>/dev/null || true
              cd "$tmpdir"
              exec "$tmpdir/scan-lan.sh" "$@"
          passthrough: true
