# Personal utilities tree for jan (canonical under dotfiles/jan).
# Multiline exec bodies use YAML literal block style (|).
metadata:
  name: jan
  description: |
    Personal utilities as a categorized `jan` subtree. Each script is inlined
    with `help` (description) and `run` (execute from embedded source).
    Script entries may declare `dependencies` (other script names whose
    directories are prepended to PATH), `requires` (external utilities such as
    `fzf` that must exist before `run`), `env` (`public` assignments and
    `private` host secret names), `inputs` (typed `--flags` / `${{ inputs.x }}`),
    and `cron` (schedules for `jan cron`).
    Prefer this tree once, then invoke commands:
      jan use /path/to/dotfiles/jan
      jan scripts git gd help
      jan scripts system lsof-port run --port 443
      jan scripts network api-get run --url 'https://api.example.com/v1/me'
commands:
  scripts:
    about: 'Personal utilities (categorized, inlined).'
    include: scripts.yaml
