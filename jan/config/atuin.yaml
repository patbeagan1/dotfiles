about: Atuin shell history (load after OMZ / zsh so it wraps the prompt)
config:
  shell: |
    # BOTTLENECK (small, ~7ms / LIBBEAGAN_TRACE): atuin init forks `atuin`.
    if [ -r "$HOME/.atuin/bin/env" ]; then
      . "$HOME/.atuin/bin/env"
    fi
    if command -v atuin >/dev/null 2>&1; then
      eval "$(atuin init zsh --disable-up-arrow)"
    fi
