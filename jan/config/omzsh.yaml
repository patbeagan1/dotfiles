about: Lightweight zsh prompt + frecent z / dotenv / extract (replaces Oh My Zsh)
config:
  shell: |
    ###########################################################
    # Standalone shell UX (formerly Oh My Zsh)
    #
    # Replaces sourcing oh-my-zsh.sh (~560ms) with small snippets under
    # $LIBBEAGAN_HOME/zsh/: re5et-style prompt, zsh-z, dotenv, extract,
    # colored man pages, and command-not-found. Completions are owned by
    # config/zsh.yaml (single compinit).
    
    if [[ -z "${LIBBEAGAN_HOME:-}" ]]; then
      print -u2 "zsh-extras: LIBBEAGAN_HOME unset; skipping prompt/plugins"
    else
      _libbeagan_zsh="$LIBBEAGAN_HOME/zsh"
      for _libbeagan_frag in \
        prompt.zsh \
        dotenv.zsh \
        extract.zsh \
        colored-man-pages.zsh \
        command-not-found.zsh
      do
        if [[ -r "$_libbeagan_zsh/$_libbeagan_frag" ]]; then
          # shellcheck disable=SC1090
          source "$_libbeagan_zsh/$_libbeagan_frag"
        else
          print -u2 "zsh-extras: missing $_libbeagan_zsh/$_libbeagan_frag"
        fi
      done
    
      # Frecent directory jump: zoxide if present, else vendored zsh-z.
      if command -v zoxide >/dev/null 2>&1; then
        eval "$(zoxide init zsh)"
      elif [[ -r "$_libbeagan_zsh/z.plugin.zsh" ]]; then
        # shellcheck disable=SC1090
        source "$_libbeagan_zsh/z.plugin.zsh"
      fi
      unset _libbeagan_frag _libbeagan_zsh
    fi
