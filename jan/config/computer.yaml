about: Resolve CURRENT_COMPUTER for machine-* fragments
config:
  shell: |
    # Machine identity for `config machine-*` guards.
    # Order: existing env → ~/.config/jan/computer → DMI / hostname heuristics.
    if [ -z "${CURRENT_COMPUTER:-}" ]; then
      _jan_computer_file="${XDG_CONFIG_HOME:-$HOME/.config}/jan/computer"
      if [ -f "$_jan_computer_file" ]; then
        CURRENT_COMPUTER="$(tr -d '[:space:]' < "$_jan_computer_file")"
      elif [ -r /sys/devices/virtual/dmi/id/sys_vendor ] \
        && grep -qi framework /sys/devices/virtual/dmi/id/sys_vendor 2>/dev/null; then
        CURRENT_COMPUTER=framework
      else
        case "$(uname -s 2>/dev/null)-$(hostname -s 2>/dev/null || hostname 2>/dev/null)" in
          Darwin-*mac2025*|Darwin-mac2025) CURRENT_COMPUTER=mac2025 ;;
          Darwin-*mac_2017*|Darwin-*2017*) CURRENT_COMPUTER=mac_2017 ;;
          Darwin-*mac_2022*|Darwin-*2022*) CURRENT_COMPUTER=mac_2022 ;;
        esac
      fi
      unset _jan_computer_file
      [ -n "${CURRENT_COMPUTER:-}" ] && export CURRENT_COMPUTER
    fi
