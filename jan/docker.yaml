# Personal utilities tree for jan (canonical under dotfiles/jan).
# Each category file inlines script `help` + `run` bodies.
# Multiline exec bodies use YAML literal block style (|).
about: docker utilities
commands:
  docker-inspect-running:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              docker-inspect-running

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - bash
            - '-lc'
            - |
              set -euo pipefail
              tmpdir="$(mktemp -d)"
              trap 'rm -rf "$tmpdir"' EXIT
              cat >"$tmpdir/_docker-inspect-running" <<'JAN_EOF_docker_inspect_running__docker_inspect_running_2de6f4f42fef'
              #compdef docker-inspect-running

              # Zsh completion for docker-inspect-running
              # Generated automatically - customize as needed

              _docker-inspect-running() {
                  local context state line
                  typeset -A opt_args
                  
                  _arguments -C \
                      '(-h --help)'{-h,--help}'[Show help information]' \
                      '(-v --version)'{-v,--version}'[Show version information]' \
                      '*::arg:_files'
              }

              _docker-inspect-running "$@"
              JAN_EOF_docker_inspect_running__docker_inspect_running_2de6f4f42fef
              chmod +x "$tmpdir/_docker-inspect-running" 2>/dev/null || true
              cat >"$tmpdir/docker-inspect-running.sh" <<'JAN_EOF_docker_inspect_running_docker_inspect_running_sh_5a6d5f4019cb'
              #!/usr/bin/zsh

              [[ $EUID -ne 0 ]] && echo "This script must be run as root." && exit 1

              main() {

              	select_docker_id() {

              	  docker ps |\
              	    fzf |\
              	    cut -d' ' -f1
              	}

              	docker inspect "$(select_docker_id)" | jq
              }

              main
              JAN_EOF_docker_inspect_running_docker_inspect_running_sh_5a6d5f4019cb
              chmod +x "$tmpdir/docker-inspect-running.sh" 2>/dev/null || true
              cd "$tmpdir"
              exec "$tmpdir/docker-inspect-running.sh" "$@"
          passthrough: true
