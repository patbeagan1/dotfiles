# Host configuration for `jan config` (emit / link / apply / deps).
# Each child is a YAML include under config/; shell and link file bodies are inlined.
about: host configuration (emit / link / apply / deps)
commands:
  # `computer` sorts before `machine-*` in emit (BTreeMap key order).
  computer:
    include: config/computer.yaml
  zsh:
    include: config/zsh.yaml
  omzsh:
    include: config/omzsh.yaml
  golang:
    include: config/golang.yaml
  android:
    include: config/android.yaml
  ios:
    include: config/ios.yaml
  emacs-path:
    include: config/emacs-path.yaml
  emacs:
    include: config/emacs.yaml
  nvim:
    include: config/nvim.yaml
  git:
    include: config/git.yaml
  deps-shim:
    include: config/deps-shim.yaml
  deps-required:
    include: config/deps-required.yaml
  deps-general:
    include: config/deps-general.yaml
  deps-languages:
    include: config/deps-languages.yaml
  deps-optional:
    include: config/deps-optional.yaml
  machine-framework:
    include: config/machines/framework.yaml
  machine-mac2025:
    include: config/machines/mac2025.yaml
  machine-mac_2022:
    include: config/machines/mac_2022.yaml
  machine-mac_2017:
    include: config/machines/mac_2017.yaml
