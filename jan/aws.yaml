# Personal utilities tree for jan (canonical under dotfiles/jan).
# Each command is a YAML include under scripts/aws/.
# Uses AWS CLI credentials (profile, env vars, or ~/.aws/credentials).
# Command names use an `aws-` prefix so `jan alias` does not shadow
# common tools (ls, cp, du, get, …).
about: AWS utilities (AWS CLI)
commands:
  aws-whoami:
    include: scripts/aws/whoami.yaml
  aws-ls-buckets:
    include: scripts/aws/ls-buckets.yaml
  aws-ls:
    include: scripts/aws/ls.yaml
  aws-bucket-sizes:
    include: scripts/aws/bucket-sizes.yaml
  aws-du:
    include: scripts/aws/du.yaml
  aws-download:
    include: scripts/aws/download.yaml
  aws-verify:
    include: scripts/aws/verify.yaml
  aws-upload:
    include: scripts/aws/upload.yaml
  aws-get:
    include: scripts/aws/get.yaml
  aws-cp:
    include: scripts/aws/cp.yaml
  aws-presign:
    include: scripts/aws/presign.yaml
