  download:
    include: scripts/aws/download.yaml
  verify:
    include: scripts/aws/verify.yaml
  upload:
    include: scripts/aws/upload.yaml
  get:
    include: scripts/aws/get.yaml
  cp:
    include: scripts/aws/cp.yaml
  presign:
    include: scripts/aws/presign.yaml
