# Personal utilities tree for jan (canonical under dotfiles/jan).
# Each category file inlines script `help` + `run` bodies.
# Multiline exec bodies use YAML literal block style (|).
about: files utilities
commands:
  basename:
    about: Print the last path component of a path.
    inputs:
      path:
        description: Path to take the basename of
        required: true
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - -lc
            - |
              cat <<'EOF'
              basename

              Print the last path component of a path.

                jan scripts files basename run --path /tmp/foo/bar.txt
                # → bar.txt
              EOF
      run:
        about: Print the basename of --path.
        exec:
          argv:
            - bash
            - -lc
            - |
              set -euo pipefail
              p="${{ inputs.path }}"
              p="${p%/}"
              printf '%s\n' "${p##*/}"
  cat-all-pretty:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              cat-all-pretty

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'bash'
            - '-lc'
            - |
              # (c) 2022 Pat Beagan: MIT License

              for i in *; do
                  echo
                  echo -----
                  echo
                  echo "# $i"
                  echo
                  cat "$i"
              done
              trackusage "$0"
          passthrough: true
  cat-ansi-remote:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              cat-ansi-remote

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'zsh'
            - '-c'
            - |
              set -euo pipefail

              scriptname="$(basename "$0")"
              help() {
                  error_code=$?
                  echo "
              Usage: $scriptname [-h|--help] <url>

              Displays ANSI content from a remote URL with proper encoding and visual effects.
              Downloads the content from the URL and displays it using cat-ansifile.

              Arguments:
                url    Remote URL containing ANSI content

              Features:
                - Downloads content from remote URL using curl
                - Clears screen before displaying (ESC c)
                - Uses cat-ansifile for proper encoding and display effects
                - Handles remote ANSI art and BBS-style content

              Examples:
                $scriptname http://example.com/ansi_art.txt
                $scriptname https://bbs.example.com/art.ans
              "
                  exit $error_code
              }

              main() {

                  emulate -L zsh
                  zmodload zsh/zutil || return 1

                  local help
                  zparseopts -D -F -K -- \
                      {h,-help}=help ||
                      return 1

                  if (($#help)); then help; fi

              cat-ansi-remote () {
              	cat-ansifile <(printf "\033c" && curl -sS "$1")
              }

                  cat-ansi-remote "$@" || help
              }

              main "$@" || help
              trackusage "$0"
          passthrough: true
  cat-ansifile:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              cat-ansifile

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'zsh'
            - '-c'
            - |
              set -euo pipefail

              scriptname="$(basename "$0")"
              help() {
                  error_code=$?
                  echo "
              Usage: $scriptname [-h|--help] <file>

              Displays an ANSI file with proper encoding conversion and visual effects.
              Converts Windows-1252 encoding to UTF-8 and displays the content with
              a small delay between lines for a retro terminal effect.

              Arguments:
                file    Path to the ANSI file to display

              Features:
                - Converts Windows-1252 to UTF-8 encoding
                - Adds visual delay between lines (0.005 seconds)
                - Creates a retro terminal viewing experience

              Examples:
                $scriptname retro.ans
                $scriptname /path/to/ansi_file.txt
              "
                  exit $error_code
              }

              main() {

                  emulate -L zsh
                  zmodload zsh/zutil || return 1

                  local help
                  zparseopts -D -F -K -- \
                      {h,-help}=help ||
                      return 1

                  if (($#help)); then help; fi

              cat-ansifile () {
              	iconv -f "windows-1252" -t "UTF-8" "$1" -o /tmp/ansi-out.txt && perl -pe "system 'sleep .005'" /tmp/ansi-out.txt 
              }

                  cat-ansifile "$@" || help
              }

              main "$@" || help
              trackusage "$0"
          passthrough: true
  cat-no-comment:
    about: A script for automated tasks.
    commands:
      help:
