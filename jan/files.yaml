                  emulate -L zsh
                  zmodload zsh/zutil || return 1

                  local help
                  zparseopts -D -F -K -- \
                      {h,-help}=help ||
                      return 1

                  if (($#help)); then help; fi

              folder_checksum () {
              	find "$1" -type f -print0 | sort -z | xargs -0 sha1sum | cut -c1-40 | sha1sum
