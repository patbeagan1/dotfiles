              }

              filetype "$@"
          passthrough: true
  flatten:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              flatten

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'bash'
            - '-lc'
            - |
              # (c) 2022 Pat Beagan: MIT License

              flatten () 
              { 
                  test -d __flattened_files || mkdir __flattened_files;
                  which gmv > /dev/null && find "$1" -type f -exec gmv --backup=numbered $(echo '{}') __flattened_files \;
              }

              flatten "$@"
              trackusage "$0"
          passthrough: true
  folder_checksum:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              folder_checksum

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'zsh'
            - '-c'
            - |
              set -euo pipefail

              scriptname="$(basename "$0")"
              help() {
                  error_code=$?
                  echo "
              Usage: $scriptname [-h|--help] <directory>

              Generates a SHA1 checksum for an entire directory by:
              1. Finding all files in the directory recursively
              2. Sorting them alphabetically
              3. Computing SHA1 for each file
              4. Concatenating all SHA1s and computing a final SHA1

              This is useful for detecting changes in directory contents or verifying
              directory integrity.

              Arguments:
                directory    Path to the directory to checksum

              Examples:
                $scriptname /path/to/directory
                $scriptname .
              "
                  exit $error_code
              }

              main() {

                  emulate -L zsh
                  zmodload zsh/zutil || return 1

                  local help
                  zparseopts -D -F -K -- \
                      {h,-help}=help ||
                      return 1

                  if (($#help)); then help; fi

              folder_checksum () {
              	find "$1" -type f -print0 | sort -z | xargs -0 sha1sum | cut -c1-40 | sha1sum
              }

                  folder_checksum "$@" || help
              }

              main "$@" || help
              trackusage "$0"
          passthrough: true
  fullpath:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              fullpath

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'bash'
            - '-lc'
            - |
              # (c) 2022 Pat Beagan: MIT License

              fullpath () 
              { 
                  case "$1" in 
                      /*)
                          printf '%s\n' "$1"
                      ;;
                      *)
                          printf '%s\n' "$PWD/$1"
                      ;;
                  esac
              }

              fullpath "$@"
              trackusage "$0"
          passthrough: true
