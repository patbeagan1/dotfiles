# Personal utilities tree for jan (canonical under dotfiles/jan).
# Each command is a YAML include under scripts/files/.
about: files utilities
aliases:
  dirs: 'ls -al | grep ''^d'''
  l: ls -F
  la: ls -A
  ldu: 'du -sh * | sort -h'
  ll: ls -lhA
  lla: ls -la
  lr: ls -ralt
  lsd: ls --group-directories-first
  lsg: 'ls | grep -i '
  lsl: 'ls -lhFA | less'
  lss: ls -harsS
  lt: 'ls | rev | sort | rev'
  ralt: ls -ralt
  sl: ls
commands:
  basename:
    include: scripts/files/basename.yaml
  cat-all-pretty:
    include: scripts/files/cat-all-pretty.yaml
  cat-ansi-remote:
    include: scripts/files/cat-ansi-remote.yaml
  cat-ansifile:
    include: scripts/files/cat-ansifile.yaml
  cat-no-comment:
    include: scripts/files/cat-no-comment.yaml
  chunk_by_quarter:
    include: scripts/files/chunk_by_quarter.yaml
  compare:
    include: scripts/files/compare.yaml
  compare_directories:
    include: scripts/files/compare_directories.yaml
  csv-summary:
    include: scripts/files/csv-summary.yaml
  extract:
    include: scripts/files/extract.yaml
  json-keys:
    include: scripts/files/json-keys.yaml
  json-summary:
    include: scripts/files/json-summary.yaml
  diffall:
    include: scripts/files/diffall.yaml
  filesplit:
    include: scripts/files/filesplit.yaml
  filetype:
    include: scripts/files/filetype.yaml
  flatten:
    include: scripts/files/flatten.yaml
  folder_checksum:
    include: scripts/files/folder_checksum.yaml
  fullpath:
    include: scripts/files/fullpath.yaml
  lk:
    include: scripts/files/lk.yaml
  nospaces:
    include: scripts/files/nospaces.yaml
  notabs:
    include: scripts/files/notabs.yaml
  remove_empty_dirs:
    include: scripts/files/remove_empty_dirs.yaml
  remove_empty_lines:
    include: scripts/files/remove_empty_lines.yaml
  remove_empty_lines_force:
    include: scripts/files/remove_empty_lines_force.yaml
  rm_empty_dirs:
    include: scripts/files/rm_empty_dirs.yaml
  rm_empty_files:
    include: scripts/files/rm_empty_files.yaml
