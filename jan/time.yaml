              #compdef days_until

              # Zsh completion for days_until
              # Generated automatically - customize as needed

              _days_until() {
                  local context state line
                  typeset -A opt_args
                  
                  _arguments -C \
                      '(-h --help)'{-h,--help}'[Show help information]' \
                      '(-v --version)'{-v,--version}'[Show version information]' \
                      '*::arg:_files'
              }

              _days_until "$@"
              JAN_EOF_days_until__days_until_e63108634711
              chmod +x "$tmpdir/_days_until" 2>/dev/null || true
              cat >"$tmpdir/days_until.py" <<'JAN_EOF_days_until_days_until_py_43b0ef65d76f'
              #!/usr/bin/env python3 

              import sys
              import argparse
              from datetime import datetime
              import math

              def calculate_time_until(event_date_str, event_name):
                  try:
                      # Parsing the event date
                      event_date = datetime.strptime(event_date_str, "%Y-%m-%d")
                  except ValueError:
                      raise ValueError("Date must be in YYYY-MM-DD format")

                  # Current date and time
                  current_date = datetime.now()
                  
                  # Time until the event
                  time_until = event_date - current_date

                  if time_until.days == -1:
                      return f"Today is {event_name}"
                  
                  # Offset to midnight
                  curr_day = datetime.now()
                  offset = datetime.now() - datetime(year=curr_day.year, month=curr_day.month, day=curr_day.day)

                  if str(time_until) != str(abs(time_until)):
                      raise ValueError("Time can't be negative")

                  # Extract years, months, weeks, and days
                  v = datetime.min + time_until + offset
                  years = v.year - 1 
                  months = v.month - 1
                  weeks = (v.day - 1) / 7
                  days = (v.day - 1) % 7 

                  years = int(years)
                  months = int(months)
                  weeks = int(weeks)
                  days = int(days)

                  # Creating parts of the output string
                  parts = []
                  if years > 0:
                      parts.append(f"{years} years")
                  if months > 0:
                      parts.append(f"{months} months")
                  if weeks > 0 and months == 0:
                      parts.append(f"{weeks} weeks")
                  if days > 0 and months == 0:
                      parts.append(f"{days} days")

                  # Joining the parts with commas and adding the event name
                  output = ", ".join(parts)
                  output += f" until {event_name}"

                  return output

              def main():
                  parser = argparse.ArgumentParser(description="Calculate time until a specified event date.")
                  parser.add_argument("event_date", help="The date of the event in YYYY-MM-DD format")
                  parser.add_argument("event_name", help="The name of the event")

                  args = parser.parse_args()

                  try:
                      result = calculate_time_until(args.event_date, args.event_name)
                      print(result)
                  except ValueError as e:
                      print(f"Error: {e}", file=sys.stderr)

              if __name__ == "__main__":
                  main()
              JAN_EOF_days_until_days_until_py_43b0ef65d76f
              chmod +x "$tmpdir/days_until.py" 2>/dev/null || true
              cd "$tmpdir"
              exec "$tmpdir/days_until.py" "$@"
          passthrough: true
  halloween-countdown:
    about: |
      Shows the number of days until Halloween. If Halloween has already passed this year, it shows days until next year's Halloween.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              halloween-countdown

              Shows the number of days until Halloween. If Halloween has already passed this year, it shows days until next year's Halloween.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - bash
            - '-lc'
            - |
              set -euo pipefail
              tmpdir="$(mktemp -d)"
              trap 'rm -rf "$tmpdir"' EXIT
              cat >"$tmpdir/halloween-countdown.sh" <<'JAN_EOF_halloween_countdown_halloween_countdown_sh_1d015369f085'
              #!/bin/bash
              # Halloween Countdown Script
              # Shows days until Halloween

              HALLOWEEN_DATE=$(date -d "$(date +%Y)-10-31" +%s 2>/dev/null || date -j -f "%Y-%m-%d" "$(date +%Y)-10-31" +%s 2>/dev/null)
              CURRENT_DATE=$(date +%s)

              if [ -z "$HALLOWEEN_DATE" ]; then
                  # Fallback calculation
                  YEAR=$(date +%Y)
                  HALLOWEEN_DATE=$(date -d "$YEAR-10-31" +%s 2>/dev/null || echo "")
              fi

              if [ -n "$HALLOWEEN_DATE" ] && [ "$HALLOWEEN_DATE" -gt "$CURRENT_DATE" ]; then
                  DAYS=$(( ($HALLOWEEN_DATE - $CURRENT_DATE) / 86400 ))
                  echo "🎃 $DAYS days until Halloween! 🎃"
              elif [ -n "$HALLOWEEN_DATE" ]; then
                  # Halloween has passed this year, show next year
                  YEAR=$(( $(date +%Y) + 1 ))
                  NEXT_HALLOWEEN=$(date -d "$YEAR-10-31" +%s 2>/dev/null || date -j -f "%Y-%m-%d" "$YEAR-10-31" +%s 2>/dev/null)
                  if [ -n "$NEXT_HALLOWEEN" ]; then
                      DAYS=$(( ($NEXT_HALLOWEEN - $CURRENT_DATE) / 86400 ))
                      echo "🎃 $DAYS days until next Halloween! 🎃"
                  else
                      echo "🎃 Happy Halloween! 🎃"
                  fi
              else
                  echo "🎃 Happy Halloween! 🎃"
              fi
              JAN_EOF_halloween_countdown_halloween_countdown_sh_1d015369f085
              chmod +x "$tmpdir/halloween-countdown.sh" 2>/dev/null || true
              cd "$tmpdir"
              exec "$tmpdir/halloween-countdown.sh" "$@"
          passthrough: true
