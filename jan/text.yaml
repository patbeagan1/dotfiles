# Personal utilities tree for jan (canonical under dotfiles/jan).
# Each category file inlines script `help` + `run` bodies.
# Multiline exec bodies use YAML literal block style (|).
about: text utilities
commands:
  append_keyword:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              append_keyword

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'bash'
            - '-lc'
            - |
              # (c) 2022 Pat Beagan: MIT License
              photo="'$1'"
              shift
              cmd="exiftool "
              for i in "$@"; do
                      cmd="$cmd-IPTC:Keywords+='$i' "
              done
              cmd="$cmd $photo"
              echo "$cmd"
              eval "$cmd"

              trackusage "$0"
          passthrough: true
