  task:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              task

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'python3'
            - '-c'
            - |
              # (c) 2022 Pat Beagan: MIT License

              import argparse
              import csv
              import datetime
              import logging
              import sys
              from argparse import Namespace
              from dataclasses import dataclass
              from pathlib import Path

              import humanize
              import pandas as pd
              from dateutil.parser import parser

              seconds_in_day = 86400


              def main():
                  local_parser = LocalParser()
                  args = local_parser.parse()
                  main = Main()

                  if args.verbose:
                      logging.basicConfig(level=logging.DEBUG)

                  if args.read or args.next:
                      csv = main.read_tasks(
                          DataMapper(
                              sprint_manager=SprintManager(
                                  sprint_length=args.sprint_length if args.sprint_length else 14,
                                  sprint_points=args.sprint_points if args.sprint_points else 60,
                              )
                          )
                      )
                      print_final_results(args, csv)
                  elif args.init:
                      main.init_tasks()
                  else:
                      main.append_tasks(
                          Row(
                              datetime.datetime.now(),
                              local_parser.get_due_timestamp(args.due),
                              args.estimate if args.estimate else 10,
                              args.priority if args.priority else 10,
                              " ".join(args.name),
                          )
                      )


              def print_final_results(args, csv):
                  csv["Con"] = csv["Confidence"]
                  output = csv[["Due", "Con", "Name"]]
                  if args.next:
                      entry = output.iloc[0]
                      print(f"Due  : {entry['Due']}")
                      print(f"Name : {entry['Name']}")
                  else:
                      logging.info("\n" + csv.to_string())
                      print(output)


              @dataclass
              class Row:
                  submitted: datetime
                  due: datetime
                  estimate: str
                  priority: str
                  name: str


              class LocalParser:
                  def parse(self) -> Namespace:
                      parser = argparse.ArgumentParser()
                      parser.add_argument("--estimate", "-e", type=int)
                      parser.add_argument(
                          "--due", "-d", choices=["day", "week", "sprint", "month", "year"]
                      )
                      parser.add_argument("--priority", "-p", type=int)
                      parser.add_argument("--read", "-r", action="store_true")
                      parser.add_argument("--sprint-length", "-sl", type=int)
                      parser.add_argument("--sprint-points", "-sp", type=int)
                      parser.add_argument("--init", action="store_true")
                      parser.add_argument("--next", action="store_true")
                      parser.add_argument("--verbose", "-v", action="store_true")
                      parser.add_argument("name", nargs="+" if self.is_name_required() else "*")
                      args = parser.parse_args()
                      return args

                  @staticmethod
                  def get_due_timestamp(it) -> datetime:
                      current = datetime.datetime.now()
                      if it == "day":
                          return current + datetime.timedelta(days=1)
                      if it == "week":
                          return current + datetime.timedelta(weeks=1)
                      if it == "sprint":
                          return current + datetime.timedelta(weeks=2)
                      if it == "month":
                          return current + datetime.timedelta(weeks=4)
                      if it == "year":
                          return current + datetime.timedelta(weeks=52)
                      else:
                          return current + datetime.timedelta(weeks=4)

                  @staticmethod
                  def is_name_required():
                      return not any([it in sys.argv for it in ["--read", "--init", "--next"]])


              @dataclass()
              class SprintManager:
                  sprint_points: int = 50
                  sprint_length: int = 14  # days
                  sprint: int = 1
                  count: int = 0

                  def reset(self):
                      self.count = 0
                      self.sprint = 0

                  def apply_ticket(self, it):
                      if (self.count + it) < self.sprint_points:
                          self.count += it
                          return self.sprint
                      else:
                          self.count = it
                          self.sprint += 1
                          return self.sprint

                  def sprint_completion_date(self, sprint: int):
                      return datetime.datetime.now() + datetime.timedelta(
                          days=((sprint) * self.sprint_length)
                      )

                  def ticket_completion_time(self, estimate: int):
                      return datetime.timedelta(
                          days=estimate * (self.sprint_length / self.sprint_points)
                      )

                  def ticket_remaining_time(self, estimate: int):
                      return (
                          datetime.timedelta(days=self.sprint_length)
                          - self.ticket_completion_time(estimate)
                          - self.ticket_completion_time(self.count)
                      )


              class DataMapper:
                  def __init__(self, sprint_manager: SprintManager):
                      self.parser = parser()
                      self.sprint_manager = sprint_manager

                  def map_submission(self, it):
                      due = self.parser.parse(it["Due"])
                      return (due - datetime.datetime.now()).total_seconds() / seconds_in_day

                  def map_human_time_due(self, it):
                      due = self.parser.parse(it["Due"])
                      submission_due = datetime.datetime.now() - due
                      return humanize.naturaltime(submission_due)

                  def map_human_time_submitted(self, it):
                      submission = self.parser.parse(str(it["Submitted"]))
                      return humanize.naturaltime(datetime.datetime.now() - submission)

                  def map_adjusted_priority(self, it):
                      return it["Time Remaining"] * it["Priority"] * it["Estimate"]

                  def map_sprints(self, it: int):
                      return self.sprint_manager.apply_ticket(it)

                  def map_sprint_confidence(self, it):
                      sprint = it["Sprint"]
                      due = self.parser.parse(str(it["Due"]))
                      estimate = it["Estimate"]
                      self.sprint_manager.apply_ticket(estimate)
                      sprint_completion_date = self.sprint_manager.sprint_completion_date(sprint)
                      ticket_remaining_time = self.sprint_manager.ticket_remaining_time(estimate)
                      return ((due - (sprint_completion_date - ticket_remaining_time))).days

                  def map_on_track(self):
                      last = self.IntByReference()

                      def accumulate(it):
                          last.value += it
                          return last.value

                      return accumulate

                  @dataclass
                  class IntByReference:
                      value: int = 0


              class Main:
                  def __init__(self):
                      self.filename = f"{Path.home()}/tasks.csv"
                      self.columns = ["Submitted", "Due", "Estimate", "Priority", "Name"]

                  def init_tasks(self):
                      with open(self.filename, "w") as f:
                          f.write("\t".join(self.columns))
                          f.write("\n")

                  def read_tasks(self, mapper: DataMapper):
                      self.data_mapper = mapper
                      csv = pd.read_csv(self.filename, delimiter="\t")
                      # 1 means to operate on the rows, not the columns.
                      csv["Time Remaining"] = csv.apply(self.data_mapper.map_submission, axis=1)
                      csv["Adjusted Priority"] = csv.apply(
                          self.data_mapper.map_adjusted_priority, axis=1
                      )
                      csv = csv.sort_values(by=["Adjusted Priority"])
                      csv["Sprint"] = csv["Estimate"].apply(self.data_mapper.map_sprints)
                      self.data_mapper.sprint_manager.reset()
                      csv["Confidence"] = csv.apply(self.data_mapper.map_sprint_confidence, axis=1)
                      csv["On track"] = csv["Confidence"].apply(self.data_mapper.map_on_track())
                      csv["Submitted"] = csv.apply(self.data_mapper.map_human_time_submitted, axis=1)
                      csv["Due"] = csv.apply(self.data_mapper.map_human_time_due, axis=1)
                      return csv

                  def append_tasks(self, row: Row):
                      with open(self.filename, "a") as csv_file:
                          writer = csv.writer(csv_file, delimiter="\t", quotechar="|")
                          writer.writerow(
                              [row.submitted, row.due, row.estimate, row.priority, row.name]
                          )
                          print("Success!")


              if __name__ == "__main__":
                  main()
          passthrough: true
  trackusage:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              trackusage

              A script for automated tasks.

              Bundled dependencies (on PATH when run): trackusage-impl

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'bash'
            - '-lc'
            - |
              # (c) 2022 Pat Beagan: MIT License
              set -euo pipefail

              # Lists by reversed size because we keep track of the number of bytes in each file
              # We care the most about the most used ones.

              foldername="$HOME/p-tracked-commands"
              if [ "$1" == "-h" ]; then
                  echo "Options are:"
                  echo "-a print all"
                  echo "-m print most used"
              elif [ "$1" == "-a" ]; then
                  echo Printing all tracked commands
                  ls -lSrc "$foldername"
                  exit 0
              elif [ "$1" == "-m" ]; then
                  echo Printing most used tracked commands
                  ls -lSrc "$foldername" | tail
                  exit 0
              fi

              foldername="$HOME/p-tracked-commands"
              mkdir -p "$foldername"
              echo >> "$foldername"/"$(basename "$1")"
          passthrough: true
    dependencies:
      - trackusage-impl
  trackusage-impl:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              trackusage-impl

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'bash'
            - '-lc'
            - |
              # (c) 2022 Pat Beagan: MIT License
              set -euo pipefail

              if [ -z "$1" ]; then
                  echo "Requires a command name, to track usages."
                  exit 1;
              fi
              foldername="$HOME/p-tracked-commands"
              mkdir -p "$foldername"
              echo >> "$foldername"/"$(basename "$1")"
          passthrough: true
  upkeep:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              upkeep

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'zsh'
            - '-c'
            - |
              ###############################################################################
              # upkeep.zsh - Strict, cross-language, yearly maintenance script
              # Languages: Python, Node.js, Rust, Kotlin
              # Features: Cache cleanup, update, format, lint, test, LICENSE update, Git tag
              ###############################################################################

              set -euo pipefail

              PROJECT_DIR="${PROJECT_DIR:-.}"
              LICENSE_FILE="$PROJECT_DIR/LICENSE"
              CURRENT_YEAR=$(date +%Y)
              TAG_NAME="upkeep-$CURRENT_YEAR"
              LOG_FILE="$PROJECT_DIR/upkeep-$CURRENT_YEAR.log"

              if [[ "$OSTYPE" == "darwin"* ]]; then
                SED_INPLACE=(-i '')
              else
                SED_INPLACE=(-i)
              fi

              cd "$PROJECT_DIR" || { echo "❌ Project directory not found: $PROJECT_DIR"; exit 1 }

              log() { echo "🔹 $1"; }
              warn() { echo "⚠️  $1"; }
              die() { echo "❌ $1"; exit 1; }

              check_tool() {
                local cmd="$1"
                local min_version="$2"
                local version_command="$3"

                if ! command -v "$cmd" >/dev/null; then
                  die "Required tool '$cmd' is not installed."
                fi

                local version
                version=$(eval "$version_command") || die "Failed to get version of $cmd"
                log "$cmd version: $version"

                # Optional: implement version comparison if strict matching is needed
              }

              clean_common_caches() {
                log "🧹 Cleaning cache files..."
                find . -type d -name "__pycache__" -exec rm -r {} + 2>/dev/null
                find . -type f \( -name "*.pyc" -o -name "*~" \) -delete
              }

              update_license_year() {
                if [[ -f "$LICENSE_FILE" ]]; then
                  log "📜 Updating LICENSE year to $CURRENT_YEAR..."
                  sed "${SED_INPLACE[@]}" -E "s/(Copyright [0-9]{4})(-[0-9]{4})?/\1-$CURRENT_YEAR/" "$LICENSE_FILE"
                else
                  warn "LICENSE file not found."
                fi
              }

              write_log() {
                log "📝 Writing log to $LOG_FILE"
                {
                  echo "Upkeep run on $(date)"
                  echo "Python: $(python3 --version 2>/dev/null || echo 'Not installed')"
                  echo "uv: $(uv --version 2>/dev/null || echo 'Not installed')"
                  echo "Node: $(node --version 2>/dev/null || echo 'Not installed')"
                  echo "Rust: $(rustc --version 2>/dev/null || echo 'Not installed')"
                  echo "Kotlin: $(kotlinc -version 2>/dev/null || echo 'Not installed')"
                } > "$LOG_FILE"
              }

              git_commit_and_tag() {
                if git rev-parse --is-inside-work-tree > /dev/null 2>&1; then
                  log "🔄 Committing and tagging in Git..."
                  git add .
                  git commit -m "🔧 Yearly upkeep: $CURRENT_YEAR" || warn "Nothing to commit."

                  if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
                    warn "Tag $TAG_NAME already exists. Skipping."
                  else
                    git tag "$TAG_NAME"
                    git push origin "$(git rev-parse --abbrev-ref HEAD)" --tags
                  fi
                else
                  warn "Not a Git repository."
                fi
              }

              # === PYTHON ===

              handle_python_project() {
                [[ ! -f "pyproject.toml" ]] && return
                log "🐍 Python project detected"

                check_tool uv "0.1.0" "uv --version"
                check_tool python3 "3.8.0" "python3 --version"
                check_tool black "22.0" "uv pip run black --version"
                check_tool flake8 "5.0" "uv pip run flake8 --version"
                check_tool pytest "7.0" "uv pip run pytest --version"

                function update_python_deps() {
                  log "📦 Updating Python dependencies via uv..."
                  uv self upgrade
                  uv pip install -U uv black flake8 pytest
                  uv pip sync --upgrade
                }

                function format_python_code() {
                  log "🎨 Formatting Python code..."
                  uv pip run black .
                }

                function lint_python_code() {
                  log "🔍 Linting Python code..."
                  uv pip run flake8 .
                }

                function test_python_code() {
                  log "🧪 Running Python tests..."
                  uv pip run pytest
                }

                update_python_deps
                format_python_code
                lint_python_code
                test_python_code
              }

              # === NODE.JS ===

              handle_node_project() {
                [[ ! -f "package.json" ]] && return
                log "📦 Node.js project detected"

                check_tool node "16.0.0" "node --version"
                check_tool npm "8.0.0" "npm --version"
                check_tool npx "8.0.0" "npx --version"

                function update_node_deps() {
                  log "⬆️ Updating Node.js dependencies..."
                  npm update
                }

                function lint_node_code() {
                  if [[ -f ".eslintrc.js" || -f ".eslintrc.json" ]]; then
                    check_tool eslint "8.0.0" "npx eslint --version"
                    log "🔍 Linting JS/TS code..."
                    npx eslint .
                  fi
                }

                function format_node_code() {
                  if [[ -f "prettier.config.js" || -f ".prettierrc" ]]; then
                    check_tool prettier "2.0.0" "npx prettier --version"
                    log "🎨 Formatting code with Prettier..."
                    npx prettier --write .
                  fi
                }

                function test_node_code() {
                  log "🧪 Running Node.js tests..."
                  npm test
                }

                update_node_deps
                lint_node_code
                format_node_code
                test_node_code
              }

              # === RUST ===

              handle_rust_project() {
                [[ ! -f "Cargo.toml" ]] && return
                log "🦀 Rust project detected"

                check_tool cargo "1.60" "cargo --version"

                function update_rust_deps() {
                  log "⬆️ Updating Rust dependencies..."
                  cargo update
                }

                function format_rust_code() {
                  log "🎨 Formatting Rust code..."
                  cargo fmt
                }

                function lint_rust_code() {
                  log "🔍 Linting Rust code..."
                  cargo clippy
                }

                function test_rust_code() {
                  log "🧪 Running Rust tests..."
                  cargo test
                }

                update_rust_deps
                format_rust_code
                lint_rust_code
                test_rust_code
              }

              # === KOTLIN ===

              handle_kotlin_project() {
                [[ ! -f "build.gradle.kts" && ! -f "build.gradle" ]] && return
                log "🤖 Kotlin/Gradle project detected"

                check_tool ./gradlew "7.0" "./gradlew --version | grep Gradle"

                function update_kotlin_deps() {
                  log "⬆️ Checking Kotlin dependency updates..."
                  ./gradlew dependencyUpdates
                }

                function format_kotlin_code() {
                  if grep -q "ktlint" build.gradle*; then
                    log "🎨 Formatting Kotlin code with ktlint..."
                    ./gradlew ktlintFormat
                  elif grep -q "spotless" build.gradle*; then
                    log "🎨 Formatting Kotlin code with Spotless..."
                    ./gradlew spotlessApply
                  else
                    warn "No Kotlin formatter configured"
                  fi
                }

                function lint_kotlin_code() {
                  if grep -q "detekt" build.gradle*; then
                    log "🔍 Linting Kotlin code with detekt..."
                    ./gradlew detekt
                  else
                    warn "No Kotlin linter configured"
                  fi
                }

                function test_kotlin_code() {
                  log "🧪 Running Kotlin tests..."
                  ./gradlew test
                }

                update_kotlin_deps
                format_kotlin_code
                lint_kotlin_code
                test_kotlin_code
              }

              # === MAIN ===

              main() {
                log "🚀 Running strict yearly upkeep on: $PROJECT_DIR"
                echo "📆 $(date)"

                clean_common_caches

                handle_python_project
                handle_node_project
                handle_rust_project
                handle_kotlin_project

                update_license_year
                write_log
                git_commit_and_tag

                log "✅ Yearly upkeep complete."
              }

              main "$@"
          passthrough: true
  list-pkg-managers:
    about: 'Probe which package-manager list commands succeed on this host (Deno).'
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              list-pkg-managers

              Probe which package-manager list commands succeed on this host (Deno).

              Requires on host: deno
              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'deno'
            - 'eval'
            - '--ext=ts'
            - '--allow-run'
            - |
              /*
              * Hardcoded list of commands to test
              *
              * While a little wasteful, each of these commands is run without sending the output to stdout
              * then we will give the user the option to run the successful commands again
              * so that they can see the output.
              *
              * These will show the commands which are installed with each of these package managers.
              * */
              const commands = [
                  ["brew", "list"],
                  ["apt", "list", "--installed"],
                  ["yum", "list", "installed"],
                  ["dnf", "list", "--installed"],
                  ["zypper", "se", "--installed-only"],
                  ["pacman", "-Q"],
                  ["port", "installed"],
                  ["rpm", "-q"],
                  ["snap", "list"],
                  ["flatpak", "list"],
                  ["npm", "list", "-g"],
                  ["cargo", "install", "--list"],
                  ["pip", "show"],
                  ["pip3", "show"],
                  ["gem", "list", "--installed"],
                  ["pear", "list"],
                  ["composer", "show"],
                  ["dotnet", "nuget", "locals", "all", "--list"],
                  ["go", "list", "-m"],
                  ["conda", "list"],
              ];

              async function runCommands(commands: string[][]) {
                  const successfulCommands: string[][] = [];

                  for (const command of commands) {
                      try {
                          // Run the command
                          const process = Deno.run({
                              cmd: command,
                              stdout: "null", // Ignore the stdout
                              stderr: "null", // Ignore the stderr
                          });

                          // Wait for the command to finish and get the status
                          const {code} = await process.status();

                          // Check if the command was successful
                          if (code === 0) {
                              successfulCommands.push(command);
                          }

                          process.close();
                      } catch (error) {
                          // ignoring errors, because we're just checking if the programs exist on the current machine.
                      }
                  }

                  return successfulCommands;
              }

              // Run the commands and print the ones that succeed
              runCommands(commands)
                  .then(successfulCommands => {
                      successfulCommands
                          .map((it) => it.join(" "))
                          .forEach((it) => console.log(it))
                  });
          passthrough: true
    requires:
      - deno

  # --- process / open-file helpers (typed inputs) ---

  lsof-net:
    about: Show processes that currently use network connections (lsof -P -i -n).
    requires: [lsof]
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - -lc
            - |
              cat <<'EOF'
              lsof-net

              Show processes that use internet connections right now.

                jan scripts system lsof-net run

              Equivalent to: lsof -P -i -n
              EOF
      run:
        about: Run lsof for internet connections.
        exec:
          argv: [lsof, -P, -i, -n]

  lsof-port:
    about: Show the process using a specific TCP/UDP port.
    requires: [lsof]
    inputs:
      port:
        description: Port number (e.g. 443)
        required: true
      proto:
        description: Protocol — tcp or udp
        default: tcp
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - -lc
            - |
              cat <<'EOF'
              lsof-port

              Show the process bound to a port.

                jan scripts system lsof-port run --port 443
                jan scripts system lsof-port run --port 53 --proto udp

              Equivalent to: lsof -i tcp:443
              EOF
      run:
        about: Run lsof for a port.
        exec:
          argv:
            - lsof
            - -i
            - ${{ inputs.proto }}:${{ inputs.port }}

  lsof-listen:
    about: List listening TCP/UDP ports with PIDs.
    requires: [lsof]
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - -lc
            - |
              cat <<'EOF'
              lsof-listen

              List listening ports and associated PIDs.

                jan scripts system lsof-listen run

              Equivalent to: lsof -Pan -i tcp -i udp
              EOF
      run:
        about: Run lsof for listening sockets.
        exec:
          argv: [lsof, -Pan, -i, tcp, -i, udp]

  lsof-listen-pretty:
    about: Show IPv4 LISTEN sockets in a column-aligned table.
    requires: [lsof, grep, column]
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - -lc
            - |
              cat <<'EOF'
              lsof-listen-pretty

              Show open ports that are LISTEN (IPv4), column-aligned.

                jan scripts system lsof-listen-pretty run
              EOF
      run:
        about: Filter lsof LISTEN lines.
        exec:
          argv:
            - bash
            - -lc
            - lsof -Pni4 | grep LISTEN | column -t

  lsof-cmd:
    about: List files opened by a command name (-c).
    requires: [lsof]
    inputs:
      process:
        description: Process / command name filter for lsof -c
        required: true
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - -lc
            - |
              cat <<'EOF'
              lsof-cmd

              List files opened by a particular command.

                jan scripts system lsof-cmd run --process nginx

              Equivalent to: lsof -c "nginx"
              EOF
      run:
        about: Run lsof -c.
        exec:
          argv:
            - lsof
            - -c
            - ${{ inputs.process }}

  lsof-user-dir:
    about: View a user's open files under a directory (-u + +D).
    requires: [lsof]
    inputs:
      user:
        description: Username
        required: true
      dir:
        description: Directory to scan (lsof +D)
        default: /etc
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - -lc
            - |
              cat <<'EOF'
              lsof-user-dir

              View user activity under a directory.

                jan scripts system lsof-user-dir run --user root --dir /var/log

              Equivalent to: lsof -u user -a +D /etc
              EOF
      run:
        about: Run lsof for user + directory.
        exec:
          argv:
            - lsof
            - -u
            - ${{ inputs.user }}
            - -a
            - +D
            - ${{ inputs.dir }}

  lsof-cwd:
    about: Show the current working directory of a process.
    requires: [lsof, grep]
    inputs:
      pid:
        description: Process ID
        required: true
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - -lc
            - |
              cat <<'EOF'
              lsof-cwd

              Show cwd of a process.

                jan scripts system lsof-cwd run --pid 1234

              Equivalent to: lsof -p PID | grep cwd
              EOF
      run:
        about: Grep cwd from lsof -p.
        exec:
          argv:
            - bash
            - -lc
            - lsof -p "${{ inputs.pid }}" | grep cwd

  lsof-large:
    about: Show the largest open files (size threshold in MB).
    requires: [lsof, awk, sort, tail, column]
    inputs:
      min_mb:
        description: Minimum size in MiB to include
        default: "1"
      count:
        description: How many largest entries to show
        default: "10"
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - -lc
            - |
              cat <<'EOF'
              lsof-large

              Show the largest open files above a size threshold.

                jan scripts system lsof-large run
                jan scripts system lsof-large run --min_mb 50 --count 20
              EOF
      run:
        about: Rank open files by size.
        exec:
          argv:
            - bash
            - -lc
            - |
              min_bytes=$(awk -v m="${{ inputs.min_mb }}" 'BEGIN { printf "%.0f", m * 1048576 }')
              lsof / 2>/dev/null | awk -v min="$min_bytes" '{
                if ($7+0 > min) printf "%.1fMB %s %s\n", $7/1048576, $9, $1
              }' | sort -n -u | tail -n "${{ inputs.count }}" | column -t

  ps-tree:
    about: Four-way scrollable process tree with full details (ps awwfux | less -S).
    requires: [ps, less]
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - -lc
            - |
              cat <<'EOF'
              ps-tree

              Show a scrollable process tree with full details.

                jan scripts system ps-tree run
              EOF
      run:
        about: Open process tree in less.
        exec:
          argv:
            - bash
            - -lc
            - ps awwfux | less -S

  ps-users:
    about: Count processes per user (sorted descending).
    requires: [ps, sort, uniq]
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - -lc
            - |
              cat <<'EOF'
              ps-users

              Processes-per-user counter.

                jan scripts system ps-users run
              EOF
      run:
        about: Aggregate ps by user.
        exec:
          argv:
            - bash
            - -lc
            - ps hax -o user | sort | uniq -c | sort -r

  ps-by-name:
    about: Show processes matching a command name (ps -lfC).
    requires: [ps]
    inputs:
      name:
        description: Process name for ps -C
        required: true
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - -lc
            - |
              cat <<'EOF'
              ps-by-name

              Show all processes by name with a full header.

                jan scripts system ps-by-name run --name nginx

              Equivalent to: ps -lfC nginx
              EOF
      run:
        about: Run ps -lfC.
        exec:
          argv:
            - ps
            - -lfC
            - ${{ inputs.name }}
