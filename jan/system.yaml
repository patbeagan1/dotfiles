# Personal utilities tree for jan (canonical under dotfiles/jan).
# Each command is a YAML include under scripts/system/.
about: system utilities
aliases:
  alert: 'notify-send --urgency=low -i "$([ $? = 0 ] && echo terminal || echo error)" "$(history|tail -n1|sed -e ''s/^\s*[0-9]\+\s*//;s/[;&|]\s*alert$//'')"'
  comment: ': <<EOF'
  cpv: rsync -ah --info=progress2
  ctl: sudo systemctl
  decrypt: gpg -d
  dush: du -sh
  egrep: egrep --color=auto
  encrypt: gpg -c
  fgrep: fgrep --color=auto
  fhere: 'find . -name '
  findempty: 'find . -type f -empty '
  grep: grep --color=auto
  h: history
  herefile: 'cat << EOF >>'
  histg: 'history | grep'
  historyg: 'history | grep'
  is: is-test
  jam: 'java -jar '
  ks: kotlinc-jvm
  mkdir: mkdir -pv
  mnt: 'mount | grep -E ^/dev | column -t'
  num_users: 'who | wc -l'
  psg: 'ps aux | grep -v grep | grep -i -e VSZ -e'
  search: grep
  show-hardware-displays: sudo lshw -numeric -C display
  slp: 'command -v is-test >/dev/null || { echo "is-test not installed, please install it."; return 1; }; is-test system os mac && pmset sleepnow || systemctl suspend'
  strictmode: set -euo pipefail
  tk_today: tk -due day
  tkn: tk --next
  tkr: 'tk --read | head -15'
  tkrr: tk --read
  track-script-usage: trackusage.sh -a
  verify-directory-contents: rsync -rvcn
  verify-hash: 'is-test system os linux && sha256sum || shasum -a 256'
  week: 'date +%V'
commands:
  macos-shell:
    os: [macos]
    about: macos shell aliases (emitted by jan alias)
    aliases:
      java11: 'export JAVA_HOME=$JAVA_11_HOME'
      java8: 'export JAVA_HOME=$JAVA_8_HOME'
      javaSet10: 'export JAVA_HOME=$(/usr/libexec/java_home -v 10); java -version'
      javaSet11: 'export JAVA_HOME=$(/usr/libexec/java_home -v 11); java -version'
      javaSet12: 'export JAVA_HOME=$(/usr/libexec/java_home -v 12); java -version'
      javaSet13: 'export JAVA_HOME=$(/usr/libexec/java_home -v 13); java -version'
      javaSet14: 'export JAVA_HOME=$(/usr/libexec/java_home -v 14); java -version'
      javaSet15: 'export JAVA_HOME=$(/usr/libexec/java_home -v 15); java -version'
      javaSet16: 'export JAVA_HOME=$(/usr/libexec/java_home -v 16); java -version'
      javaSet17: 'export JAVA_HOME=$(/usr/libexec/java_home -v 17); java -version'
      javaSet21: 'export JAVA_HOME=$(/usr/libexec/java_home -v 21); java -version'
      javaSet24: 'export JAVA_HOME=$(/usr/libexec/java_home -v 24); java -version'
      javaSet7: 'export JAVA_HOME=$(/usr/libexec/java_home -v 1.7); java -version'
      javaSet8: 'export JAVA_HOME=$(/usr/libexec/java_home -v 1.8); java -version'
      javaSet9: 'export JAVA_HOME=$(/usr/libexec/java_home -v 9); java -version'
      java_list: '/bin/zsh -lc "/usr/libexec/java_home -V 2>&1 | cat"'
      mac_hideFiles: defaults write com.apple.finder AppleShowAllFiles NO; killall Finder /System/Library/CoreServices/Finder.app
      mac_hideFinderLocation: 'defaults write com.apple.finder _FXShowPosixPathInTitle -bool NO && killall Finder'
      mac_showFiles: defaults write com.apple.finder AppleShowAllFiles YES; killall Finder /System/Library/CoreServices/Finder.app
      mac_showFinderLocation: 'defaults write com.apple.finder _FXShowPosixPathInTitle -bool YES && killall Finder'
      readOutLoud: say -v Moira -i -f
      read_out_loud: readOutLoud
  linux-shell:
    os: [linux]
    about: linux shell aliases (emitted by jan alias)
    aliases:
      battery: 'is-test system os linux && upower -d || echo Linux only'
      ps: ps -aux
      qp: 'ps auxwww|more'
      tulpn: netstat -tulpn
      # --- identity / overview ---
      sys-os: 'cat /etc/os-release'
      sys-uname: uname -a
      sys-host: hostnamectl
      sys-time: timedatectl
      sys-locale: localectl
      sys-uptime: 'uptime; echo; cat /proc/uptime'
      sys-who: 'who -a; echo; w'
      sys-last: 'last -a | head -40'
      sys-sessions: loginctl list-sessions
      sys-machine-id: 'cat /etc/machine-id; echo; cat /proc/sys/kernel/hostname'
      # --- hardware ---
      sys-cpu: lscpu
      sys-cpuinfo: 'cat /proc/cpuinfo'
      sys-hw: 'sudo lshw -short'
      sys-hw-full: 'sudo lshw -numeric'
      sys-pci: 'lspci -nnvv'
      sys-usb: 'lsusb -v'
      sys-block: 'lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINT,UUID,MODEL,SERIAL,ROTA,TRAN,STATE'
      sys-disks: 'ls -la /dev/disk/by-id /dev/disk/by-path /dev/disk/by-uuid /dev/disk/by-label 2>/dev/null'
      sys-blkid: 'sudo blkid'
      sys-dmi: 'sudo dmidecode'
      sys-dmi-sys: 'sudo dmidecode -t system'
      sys-dmi-bios: 'sudo dmidecode -t bios'
      sys-dmi-mem: 'sudo dmidecode -t memory'
      sys-dmi-cpu: 'sudo dmidecode -t processor'
      sys-dmi-board: 'sudo dmidecode -t baseboard'
      sys-sensors: 'sensors -A 2>/dev/null || echo "sensors not installed (lm-sensors)"'
      sys-numa: 'numactl --hardware 2>/dev/null || cat /proc/buddyinfo'
      sys-smart: 'sudo smartctl --scan 2>/dev/null; echo; for d in /dev/sd[a-z] /dev/nvme[0-9]n[0-9]; do [ -e "$d" ] && echo "=== $d ===" && sudo smartctl -a "$d" 2>/dev/null; done'
      sys-gpu: 'sudo lshw -numeric -C display; echo; lspci | grep -iE ''vga|3d|display'''
      sys-audio: 'aplay -l 2>/dev/null; echo; cat /proc/asound/cards 2>/dev/null'
      sys-input: 'cat /proc/bus/input/devices'
      # --- memory ---
      sys-mem: free -h
      sys-mem-m: free -m
      sys-meminfo: 'cat /proc/meminfo'
      sys-mem-top: 'ps -eo pid,user,pmem,rss,comm --sort=-rss | head -25'
      sys-swap: 'cat /proc/swaps; echo; free -h | grep -i swap'
      sys-slab: 'cat /proc/slabinfo 2>/dev/null | head -60'
      sys-buddy: 'cat /proc/buddyinfo'
      sys-pagetype: 'cat /proc/pagetypeinfo'
      sys-vmstat: 'vmstat -s; echo; vmstat 1 5'
      sys-psi: 'echo "=== memory ==="; cat /proc/pressure/memory 2>/dev/null; echo "=== cpu ==="; cat /proc/pressure/cpu 2>/dev/null; echo "=== io ==="; cat /proc/pressure/io 2>/dev/null'
      sys-oom: 'dmesg -T 2>/dev/null | grep -iE ''oom|killed process'' | tail -40; echo; journalctl -k -b --no-pager 2>/dev/null | grep -iE ''oom|killed process'' | tail -20'
      # --- /proc ---
      sys-proc-version: 'cat /proc/version'
      sys-proc-cmdline: 'cat /proc/cmdline'
      sys-proc-load: 'cat /proc/loadavg'
      sys-proc-mounts: 'cat /proc/mounts'
      sys-proc-fs: 'cat /proc/filesystems'
      sys-proc-parts: 'cat /proc/partitions'
      sys-proc-diskstats: 'cat /proc/diskstats'
      sys-proc-interrupts: 'cat /proc/interrupts'
      sys-proc-softirqs: 'cat /proc/softirqs'
      sys-proc-modules: 'cat /proc/modules'
      sys-proc-devices: 'cat /proc/devices'
      sys-proc-ioports: 'cat /proc/ioports'
      sys-proc-iomem: 'cat /proc/iomem'
      sys-proc-dma: 'cat /proc/dma'
      sys-proc-netdev: 'cat /proc/net/dev'
      sys-proc-netstat: 'cat /proc/net/netstat'
      sys-proc-sockstat: 'cat /proc/net/sockstat; echo; cat /proc/net/sockstat6 2>/dev/null'
      sys-proc-route: 'cat /proc/net/route; echo; cat /proc/net/ipv6_route 2>/dev/null | head -40'
      sys-proc-cgroups: 'cat /proc/cgroups; echo; cat /proc/self/cgroup'
      sys-proc-limits: 'cat /proc/self/limits'
      sys-proc-status: 'cat /proc/self/status'
      sys-proc-stat: 'cat /proc/stat'
      sys-proc-zoneinfo: 'cat /proc/zoneinfo | head -80'
      sys-proc-vmalloc: 'cat /proc/vmallocinfo 2>/dev/null | head -40'
      sys-proc-crypto: 'cat /proc/crypto | head -80'
      sys-proc-key-users: 'cat /proc/key-users 2>/dev/null'
      sys-proc-sysrq: 'cat /proc/sys/kernel/sysrq'
      # --- /dev ---
      sys-dev: 'ls -la /dev'
      sys-dev-block: 'ls -la /dev/block /dev/disk 2>/dev/null; echo; lsblk -f'
      sys-dev-char: 'ls -la /dev/char 2>/dev/null | head -80'
      sys-dev-mapper: 'ls -la /dev/mapper 2>/dev/null; echo; sudo dmsetup ls 2>/dev/null'
      sys-dev-shm: 'df -h /dev/shm; echo; ls -la /dev/shm'
      sys-dev-pts: 'ls -la /dev/pts'
      sys-dev-net: 'ls -la /dev/net 2>/dev/null; echo; ip -br link'
      # --- storage / mounts ---
      sys-df: 'df -hT'
      sys-df-i: 'df -hi'
      sys-mount: 'mount | column -t'
      sys-findmnt: 'findmnt -A'
      sys-fstab: 'cat /etc/fstab'
      sys-lvm: 'sudo pvs; echo; sudo vgs; echo; sudo lvs'
      sys-md: 'cat /proc/mdstat 2>/dev/null; echo; sudo mdadm --detail --scan 2>/dev/null'
      # --- kernel / modules / boot ---
      sys-kernel: 'uname -r; echo; cat /proc/version; echo; ls -la /boot/vmlinuz* /boot/initrd* /boot/initramfs* 2>/dev/null'
      sys-modules: 'lsmod'
      sys-dmesg: 'dmesg -T | tail -100'
      sys-dmesg-err: 'dmesg -T -l err,crit,alert,emerg | tail -50'
      sys-sysctl: 'sysctl -a 2>/dev/null | head -200'
      sys-sysctl-vm: 'sysctl -a 2>/dev/null | grep -E ''^vm\.'''
      sys-sysctl-net: 'sysctl -a 2>/dev/null | grep -E ''^net\.'' | head -80'
      sys-cmdline: 'cat /proc/cmdline'
      # --- processes / load ---
      sys-top-cpu: 'ps -eo pid,user,pcpu,pmem,comm --sort=-pcpu | head -25'
      sys-top-mem: 'ps -eo pid,user,pcpu,pmem,rss,comm --sort=-rss | head -25'
      sys-load: 'uptime; echo; cat /proc/loadavg; echo; nproc; echo; grep -c ^processor /proc/cpuinfo'
      sys-iostat: 'iostat -xz 1 3 2>/dev/null || vmstat 1 3'
      sys-iotop: 'sudo iotop -oP -n 3 2>/dev/null || echo "iotop not installed"'
      # --- network state ---
      sys-ip: 'ip -br addr; echo; ip -br link; echo; ip route'
      sys-ss: 'ss -tulnp'
      sys-ss-all: 'ss -tanp'
      sys-neigh: 'ip neigh'
      sys-resolv: 'cat /etc/resolv.conf; echo; resolvectl status 2>/dev/null || systemd-resolve --status 2>/dev/null'
      # --- systemd / services ---
      sys-failed: systemctl --failed
      sys-timers: 'systemctl list-timers --all'
      sys-units: 'systemctl list-units --type=service --state=running'
      sys-boot: 'systemd-analyze; echo; systemd-analyze blame | head -30'
      sys-journal: 'journalctl -b -n 50 --no-pager'
      # --- power / thermal ---
      sys-power: 'upower -d 2>/dev/null; echo; cat /sys/class/power_supply/*/uevent 2>/dev/null'
      sys-thermal: 'paste <(cat /sys/class/thermal/thermal_zone*/type 2>/dev/null) <(cat /sys/class/thermal/thermal_zone*/temp 2>/dev/null) 2>/dev/null; echo; sensors -A 2>/dev/null'
      sys-freq: 'cat /proc/cpuinfo | grep -E ''model name|MHz''; echo; cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_cur_freq 2>/dev/null'
      # --- dump many sources at once ---
      sys-info: 'echo "=== host ==="; hostnamectl 2>/dev/null; echo; echo "=== os ==="; cat /etc/os-release; echo; echo "=== uname ==="; uname -a; echo; echo "=== uptime ==="; uptime; echo; echo "=== cpu ==="; lscpu | head -40; echo; echo "=== mem ==="; free -h; echo; echo "=== disks ==="; lsblk; echo; echo "=== mounts ==="; df -hT; echo; echo "=== net ==="; ip -br addr'
      sys-proc-dump: 'echo "=== version ==="; cat /proc/version; echo; echo "=== cmdline ==="; cat /proc/cmdline; echo; echo "=== loadavg ==="; cat /proc/loadavg; echo; echo "=== meminfo ==="; cat /proc/meminfo; echo; echo "=== swaps ==="; cat /proc/swaps; echo; echo "=== partitions ==="; cat /proc/partitions; echo; echo "=== modules ==="; cat /proc/modules | head -40'
  cputemp:
    include: scripts/system/cputemp.yaml
  cputemp-linux-sorted:
    include: scripts/system/cputemp-linux-sorted.yaml
  cputemp-linux-track:
    include: scripts/system/cputemp-linux-track.yaml
  cputemp-mac:
    include: scripts/system/cputemp-mac.yaml
  fileedit:
    include: scripts/system/fileedit.yaml
  install-deb:
    include: scripts/system/install-deb.yaml
  lsdaemons:
    include: scripts/system/lsdaemons.yaml
  machinetype:
    include: scripts/system/machinetype.yaml
  sdk-tool:
    include: scripts/system/sdk.yaml
  server:
    include: scripts/system/server.yaml
  task:
    include: scripts/system/task.yaml
  upkeep:
    include: scripts/system/upkeep.yaml
  list-pkg-managers:
    include: scripts/system/list-pkg-managers.yaml
  lsof-net:
    include: scripts/system/lsof-net.yaml
  lsof-port:
    include: scripts/system/lsof-port.yaml
  lsof-listen:
    include: scripts/system/lsof-listen.yaml
  lsof-listen-pretty:
    include: scripts/system/lsof-listen-pretty.yaml
  lsof-cmd:
    include: scripts/system/lsof-cmd.yaml
  lsof-user-dir:
    include: scripts/system/lsof-user-dir.yaml
  lsof-cwd:
    include: scripts/system/lsof-cwd.yaml
  lsof-large:
    include: scripts/system/lsof-large.yaml
  ps-tree:
    include: scripts/system/ps-tree.yaml
  ps-users:
    include: scripts/system/ps-users.yaml
  ps-by-name:
    include: scripts/system/ps-by-name.yaml
