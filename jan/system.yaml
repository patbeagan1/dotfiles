# Personal utilities tree for jan (canonical under dotfiles/jan).
# Each category file inlines script `help` + `run` bodies.
# Multiline exec bodies use YAML literal block style (|).
about: system utilities
commands:
  cputemp:
    about: A cross-platform CPU temperature monitoring script that works on both macOS and Linux systems.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              cputemp

              A cross-platform CPU temperature monitoring script that works on both macOS and Linux systems.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'bash'
            - '-lc'
            - |
              # (c) 2022 Pat Beagan: MIT License
              # Cross-platform CPU temperature monitoring script
              # Supports macOS (via iStats) and Linux (via /sys/class/thermal)

              check_install() {
                  if hash "$1" 2>/dev/null; then
                      return 0
                  else
                      read -p "$1 is not installed. Want to install it?" -n 1 -r;
                      echo;
                      if [[ $REPLY =~ ^[Yy]$ ]]; then
                          local com=""
                          case "$1" in
                              iStats*)
                                  com="gem install iStats"
                              ;;
                              *)
                                  com=""
                              ;;
                          esac;
                          if [[ -n "$com" ]]; then
                              eval "$com"
                              return $?
                          fi
                      fi
                      return 1
                  fi
              }

              cputemp () {
                  if is-test system os mac; then
                      if ! check_install iStats; then
                          echo "iStats is required for macOS CPU temperature monitoring."
                          echo "Please install it with: gem install iStats"
                          exit 1
                      fi

                      c=$(iStats | grep 'CPU temp' | sed s/[a-zA-Z\ :]*// | sed s/°.*//);
                      if [[ -n "$c" ]]; then
                          echo "9*$c/5+32" | bc -l;
                      else
                          echo "Could not read CPU temperature from iStats"
                          exit 1
                      fi
                  elif is-test system os linux; then
                      if [[ ! -d "/sys/class/thermal" ]]; then
                          echo "Thermal monitoring not available on this Linux system"
                          exit 1
                      fi

                      paste \
                          <(cat /sys/class/thermal/thermal_zone*/type) \
                          <(cat /sys/class/thermal/thermal_zone*/temp) | \
                          column -s $'\t' -t | \
                          sed 's/\(.\)..$/.\1°C/'
                  else
                      echo "Unsupported operating system. This script works on macOS and Linux."
                      exit 1
                  fi
              }

              cputemp "$@"
              trackusage "$0"
          passthrough: true
  cputemp-linux-sorted:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              cputemp-linux-sorted

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'zsh'
            - '-c'
            - |
              # (c) 2022 Pat Beagan: MIT License

              cputemp |
                  awk '{ 
                       printf "%s ", $NF; 
                       for(i=1;i<NF;i++){
                           printf "%s ", $i
                       }; 
                      printf "\n" 
                  }' |
                  sort -nr
          passthrough: true
  cputemp-linux-track:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              cputemp-linux-track

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'bash'
            - '-lc'
            - |
              # (c) 2022 Pat Beagan: MIT License

              trackusage "$0"
              loop -c cputemp
          passthrough: true
