            - |
              # (c) 2022 Pat Beagan: MIT License

              check_install() {
                  if hash "$1" 2>/dev/null; then
                      return 0
                  else
                      read -p "$1 is not installed. Want to install it?" -n 1 -r;
                      echo;
                      if [[ $REPLY =~ ^[Yy]$ ]]; then
                          local com=""
                          case "$1" in
                              iStats*)
                                  com="gem install iStats"
                              ;;
                              *)
                                  com=""
                              ;;
                          esac;
                          if [[ -n "$com" ]]; then
                              eval "$com"
                              return $?
                          fi
                      fi
                      return 1
                  fi
              }

              cputemp () {
                  if is-test system os mac; then
                      if ! check_install iStats; then
                          echo "iStats is required for macOS CPU temperature monitoring."
                          echo "Please install it with: gem install iStats"
                          exit 1
                      fi

                      c=$(iStats | grep 'CPU temp' | sed s/[a-zA-Z\ :]*// | sed s/°.*//);
                      if [[ -n "$c" ]]; then
                          echo "9*$c/5+32" | bc -l;
                      else
                          echo "Could not read CPU temperature from iStats"
                          exit 1
                      fi
                  elif is-test system os linux; then
                      if [[ ! -d "/sys/class/thermal" ]]; then
                          echo "Thermal monitoring not available on this Linux system"
                          exit 1
                      fi

                      paste \
                          <(cat /sys/class/thermal/thermal_zone*/type) \
                          <(cat /sys/class/thermal/thermal_zone*/temp) | \
                          column -s $'\t' -t | \
                          sed 's/\(.\)..$/.\1°C/'
                  else
                      echo "Unsupported operating system. This script works on macOS and Linux."
                      exit 1
                  fi
              }

              cputemp "$@"
              trackusage "$0"
          passthrough: true
  install-deb:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              install-deb

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'zsh'
            - '-c'
            - |
              # (c) 2022 Pat Beagan: MIT License

              set -euo pipefail
              IFS=$'\n\t'

              scriptname="$(basename "$0")"

              help () {
                  error_code=$?
                  echo "
              Usage: $scriptname [-h|--help] <deb_file>

              Installs a Debian package (.deb file) using dpkg with sudo privileges.
              This is a simple wrapper around 'sudo dpkg -i' for convenience.

              Arguments:
                deb_file    Path to the .deb file to install

              Examples:
                $scriptname package.deb
                $scriptname /path/to/package.deb

              Note: Requires sudo privileges to install packages.
              "
                  if [[ ! $error_code -eq 0 ]]; then echo "Err: $error_code"; fi
              }

              install () {
              	sudo dpkg -i "$1"
              }

              install "$@" || help
              trackusage "$0"
          passthrough: true
