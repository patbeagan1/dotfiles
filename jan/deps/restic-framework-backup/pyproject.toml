[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restic-framework-backup"
version = "0.1.0"
description = "Encrypted wrapper for Restic backups with YAML config, ignore rules, and dry-run estimation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
restic-framework-backup = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
