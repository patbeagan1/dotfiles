  img_to_qrcode_set:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              img_to_qrcode_set

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - 'python3'
            - '-c'
            - |
              import numpy as np
              from PIL import Image, ImageDraw, ImageColor
              import qrcode
              from io import BytesIO
              import base64
              import argparse
              import lzma


              def image_to_data_uri(img):
                  buffered = BytesIO()
                  img.save(buffered, format="webp")
                  data_uri = (
                      f"data:image/webp;base64,{base64.b64encode(buffered.getvalue()).decode()}"
                  )
                  return to_itty(f"""<img src="{data_uri}"/>""")


              def divide_image(img, image_path, section_size):
                  img = Image.open(image_path)
                  img_width, img_height = img.size

                  sections = []
                  for y in range(0, img_height, section_size):
                      for x in range(0, img_width, section_size):
                          box = (x, y, x + section_size, y + section_size)
                          section = img.crop(box)
                          sections.append(section)

                  return sections


              def to_itty(s):
                  return "https://itty.bitty.site/#/" + base64.b64encode(
                      lzma.compress(bytes(s, encoding="utf-8"), format=lzma.FORMAT_ALONE, preset=9)
                  ).decode("utf-8")


              def create_qr_codes(sections):
                  qr_images = []
                  for section in sections:
                      data_uri = image_to_data_uri(section)
                      qr = qrcode.QRCode(version=None, box_size=1, border=5)
                      qr.add_data(data_uri)
                      qr.make(fit=True)
                      qr_img = qr.make_image(fill="black", back_color="white")
                      qr_images.append(qr_img)

                  return qr_images


              def montage_with_qr(sections, qr_images, section_size):
                  section_size = 177 + 20  # width of module 40 qr code with 10 px border
                  halfsize = int(section_size / 2)

                  num_sections = len(sections)
                  img_width = section_size + halfsize
                  montage_width = int(np.ceil(np.sqrt(num_sections)))
                  montage_height = int(np.ceil(num_sections / montage_width))
                  montage_img = Image.new(
                      "RGB", (montage_width * img_width, montage_height * section_size)
                  )

                  draw = ImageDraw.Draw(montage_img)

                  for i, (section, qr_img) in enumerate(zip(sections, qr_images)):
                      x = (i % montage_width) * img_width
                      y = (i // montage_width) * section_size

                      draw.line([(0, y), (montage_width * img_width, y)], fill=(255, 0, 255), width=2)
                      montage_img.paste(section.resize((halfsize, section_size)), (x, y))
                      montage_img.paste(
                          qr_img, (x + halfsize, y)  # .resize((section_size, section_size)),
                      )

                  return montage_img


              def main(image_path, output_path):
                  section_size = 60
                  img = Image.open(image_path)

                  sections = divide_image(img, image_path, section_size)
                  qr_images = create_qr_codes(sections)
                  montage_img = montage_with_qr(sections, qr_images, section_size)
                  montage_img.save(output_path)

              if __name__ == "__main__":
                  """
                  Next steps:
                  - Clone this script
                  - Have new version print out the base image first, with a grid that has an overlay with number coordinates
                  - Similar to an archeological dig site. 
                  - Then, add the QR codes one by one to the bottom, with a numbered title.
                  - Would make it more printer-friendly. 
                  - Could have something like 4 QR per row, to make sure that the QR codes would have the proper DPI when printed.  
                  """
                  parser = argparse.ArgumentParser(
                      description="Create a montage of image sections and their QR codes."
                  )
                  parser.add_argument("image_path", help="Path to the input image")
                  parser.add_argument("output_path", help="Path for saving the output montage")
                  args = parser.parse_args()

                  main(args.image_path, args.output_path)
          passthrough: true
