              }

              _comicify "$@"
              JAN_EOF_comicify__comicify_e1d0b0f21923
              chmod +x "$tmpdir/_comicify" 2>/dev/null || true
              cat >"$tmpdir/comicify.sh" <<'JAN_EOF_comicify_comicify_sh_9541799a081f'
              #!/usr/bin/env zsh
              # (c) 2022 Pat Beagan: MIT License

              comicify ()
              {
                  comic ()
                  {
                      name=$(echo "$1" | sed 's/\///g')
                      zip -r "$name".zip "$name";
                      mv "$name".zip "$name".cbz
                  }

                  for i in $(ls | grep -v .cbz);
                  do
                      match='false';
                      for j in $(ls | grep .cbz);
                      do
                          if [[ "$j" =~ "$i" ]]; then
                              match='true';
                              break;
                          fi;
                      done;
                      if [ $match = 'true' ]; then
                          echo 'comicified   '"$i";
                      else
                          [[ -d NOZIP ]] || mkdir NOZIP
                          if [ "$i" != "NOZIP" ]; then
                              echo 'comic create '"$i";
                              mv "$i"/*.webm NOZIP
                              comic "$i";
                          fi
                      fi;
                  done
              }
              comicify
              trackusage "$0"
              JAN_EOF_comicify_comicify_sh_9541799a081f
              chmod +x "$tmpdir/comicify.sh" 2>/dev/null || true
              cd "$tmpdir"
              exec "$tmpdir/comicify.sh" "$@"
          passthrough: true
