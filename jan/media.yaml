# Personal utilities tree for jan (canonical under dotfiles/jan).
# Each command is a YAML include under scripts/media/.
about: media utilities
aliases:
  chafa-all: 'for i in *; do chafa "$i"; sleep 0.5; done'
  convert-list: convert -list list
  convert-list-channel: convert -list channel
  convert-list-color: convert -list color
  convert-list-colorspace: convert -list colorspace
  convert-list-command: convert -list command
  convert-list-compose: convert -list compose
  convert-list-configure: convert -list configure
  convert-list-decoration: convert -list decoration
  convert-list-filter: convert -list filter
  convert-list-font: convert -list font
  convert-list-format: convert -list format
  convert-list-functions: convert -list
  convert-list-gravity: convert -list gravity
  convert-list-primitive: convert -list primitive
  convert-list-style: convert -list style
  convert-list-threshold: convert -list threshold
  convert-list-type: convert -list type
  convert-list-virtual: convert -list virtual-pixel
  img-identify: identify -verbose
  img-jpgdir-to-gif: 'convert -delay 20 -loop 0 *.jpg myimage.gif'
  img-resize-to-web: 'mogrify -resize 690\> *.png'
  qr_address: 'qr "http://`pretty_ip -f0`"'
  qr_compileAggregate: 'montage /tmp/qr-output* -geometry 120x120+1+1 montage.out.jpg'
  record: asciinema rec
  shrink_mov_from: ffmpeg -vcodec libx264 -crf 20 output.mp4 -i
commands:
  accioImage:
    include: scripts/media/accioImage.yaml
  chafa-interactive:
    include: scripts/media/chafa-interactive.yaml
  comic:
    include: scripts/media/comic.yaml
  comicify:
    include: scripts/media/comicify.yaml
  dot2pdf:
    include: scripts/media/dot2pdf.yaml
  image-stitch:
    include: scripts/media/image-stitch.yaml
  imagefix:
    include: scripts/media/imagefix.yaml
  img_gif_to_spritesheet:
    include: scripts/media/img_gif_to_spritesheet.yaml
  img_resize_200:
    include: scripts/media/img_resize_200.yaml
  img_resize_32:
    include: scripts/media/img_resize_32.yaml
  img_resize_64:
    include: scripts/media/img_resize_64.yaml
  img_to_qrcode_set:
    include: scripts/media/img_to_qrcode_set.yaml
  img_wiggle_parallel:
    include: scripts/media/img_wiggle_parallel.yaml
  multi-qr:
    include: scripts/media/multi-qr.yaml
  pdf2png:
    include: scripts/media/pdf2png.yaml
  pdf2scaledpng:
    include: scripts/media/pdf2scaledpng.yaml
  pngresize:
    include: scripts/media/pngresize.yaml
  qrencoder:
    include: scripts/media/qrencoder.yaml
  vid-compress:
    include: scripts/media/vid-compress.yaml
  download-images:
    include: scripts/media/download-images.yaml
