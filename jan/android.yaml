              }

              _emulator-start-charles "$@"
              JAN_EOF_emulator_start_charles__emulator_start_charles_de0e61f5eaa9
              chmod +x "$tmpdir/_emulator-start-charles" 2>/dev/null || true
              cat >"$tmpdir/emulator-start-charles.sh" <<'JAN_EOF_emulator_start_charles_emulator_start_charles_sh_642b226e999e'
              #!/usr/bin/env zsh

              set -euo pipefail

              scriptname="$(basename "$0")"
              help() {
                  error_code=$?
                  echo "
              Usage: $scriptname [-h|--help]

              Starts an Android emulator with Charles Proxy configured for network debugging.
              Automatically detects your local IP address and configures the emulator to use
              Charles Proxy running on port 8888.

              Features:
                - Automatically finds your local IP address
                - Uses fzf to select an emulator from available AVDs
                - Configures HTTP proxy for network traffic inspection
                - Optimized network settings (no delay, full speed)

              Requires:
                - Android SDK with emulator tools
                - Charles Proxy running on port 8888
                - fzf for emulator selection
              "
                  exit $error_code
              }

              main() {

                  emulate -L zsh
                  zmodload zsh/zutil || return 1

                  local help
                  zparseopts -D -F -K -- \
                      {h,-help}=help ||
                      return 1

                  if (($#help)); then help; fi

              emulator-start-charles () {
              	local ip_address="$(ifconfig | grep 192 | sed 's/.*inet//g' | sed 's/netmask.*//g')" local emu="$(emulator -list-avds | fzf)" 
              	emulator -netdelay none -netspeed full -http-proxy http://"$ip_address":8888 -avd "$emu"
              }

                  emulator-start-charles "$@" || help
              }

              main "$@" || help
              trackusage "$0"
              JAN_EOF_emulator_start_charles_emulator_start_charles_sh_642b226e999e
              chmod +x "$tmpdir/emulator-start-charles.sh" 2>/dev/null || true
              cd "$tmpdir"
              exec "$tmpdir/emulator-start-charles.sh" "$@"
          passthrough: true
  gradle_by_module:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              gradle_by_module

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - bash
            - '-lc'
            - |
              set -euo pipefail
              tmpdir="$(mktemp -d)"
              trap 'rm -rf "$tmpdir"' EXIT
              cat >"$tmpdir/_gradle_by_module" <<'JAN_EOF_gradle_by_module__gradle_by_module_d8c0b4bd2af7'
              #compdef gradle_by_module

              # Zsh completion for gradle_by_module
              # Generated automatically - customize as needed


              _gradle_by_module() {
                  local context state line
                  typeset -A opt_args
                  
                  _arguments -C \
                      '(-h --help)'{-h,--help}'[Show help information]' \
                      '(-v --version)'{-v,--version}'[Show version information]' \
                      '-d[Custom option]' \
                      '-h[Custom option]' \
                      '-t[Custom option]' \        '*::arg:_files'
              }

              _gradle_by_module "$@"
              JAN_EOF_gradle_by_module__gradle_by_module_d8c0b4bd2af7
              chmod +x "$tmpdir/_gradle_by_module" 2>/dev/null || true
              cat >"$tmpdir/gradle_by_module.zsh" <<'JAN_EOF_gradle_by_module_gradle_by_module_zsh_afc8c6bee8ca'
              #!/bin/zsh

              show_help() {
                cat <<EOF
              Usage: $(basename "$0") [options]

              Runs tests and/or detekt for modules changed compared to origin/develop.

              Options:
                --test         Run unit tests for changed modules
                --detekt       Run detekt for changed modules
                -h, --help     Show this help message

              If no options are provided, nothing will be run.
              EOF
              }

              run_tests=0
              run_detekt=0

              # Parse CLI flags (additive)
              for arg in "$@"; do
                case "$arg" in
                  --test)
                    run_tests=1
                    ;;
                  --detekt)
                    run_detekt=1
                    ;;
                  -h|--help)
                    show_help
                    exit 0
                    ;;
                  *)
                    echo "Unknown option: $arg"
                    show_help
                    exit 1
                    ;;
                esac
              done

              if [[ $run_tests -eq 0 && $run_detekt -eq 0 ]]; then
                echo "Nothing to do: please specify --test and/or --detekt."
                show_help
                exit 0
              fi

              # Ensure you are in the root directory of your git repository
              if [ ! -d ".git" ]; then
                echo "Error: Please run this script from the root of your git repository."
                exit 1
              fi

              # 1. Get a list of changed files compared to the develop branch
              changed_files=$(git diff --name-only origin/develop)

              if [ -z "$changed_files" ]; then
                echo "No changes detected compared to the develop branch."
                exit 0
              fi

              # An associative array to store the unique module paths
              typeset -A changed_modules

              # 2. For each changed file, find the corresponding module
              for file in ${(f)changed_files}; do
                dir=$(dirname "$file")
                # Traverse up the directory tree to find the module root
                while [ "$dir" != "." ]; do
                  if [ -f "$dir/build.gradle.kts" ] || [ -f "$dir/build.gradle" ]; then
                    # Convert the directory path to a Gradle module path
                    module_path=":${dir//\//:}"
                    changed_modules[$module_path]=1
                    break
                  fi
                  dir=$(dirname "$dir")
                done
              done

              # 3. Check if any modules were identified
              if [ ${#changed_modules[@]} -eq 0 ]; then
                echo "No changed modules with a build.gradle[.kts] file found."
                exit 0
              fi

              # 4. Construct the gradlew command
              gradle_cmd="./gradlew --configure-on-demand"
              gradle_tasks=()

              for module in "${(@k)changed_modules}"; do
                if [[ $run_tests -eq 1 ]]; then
                  gradle_tasks+=("${module}:testAlphaDebugUnitTest")
                fi
                if [[ $run_detekt -eq 1 ]]; then
                  gradle_tasks+=("${module}:detekt")
                fi
              done

              if [[ ${#gradle_tasks[@]} -eq 0 ]]; then
                echo "No tasks to run for the selected modules."
                exit 0
              fi

              echo "Running for the following modules:"
              for module in "${(@k)changed_modules}"; do
                echo "- $module"
              done

              echo
              echo "Executing command: $gradle_cmd ${gradle_tasks[*]}"
              echo

              eval "$gradle_cmd ${gradle_tasks[*]}"
              JAN_EOF_gradle_by_module_gradle_by_module_zsh_afc8c6bee8ca
              chmod +x "$tmpdir/gradle_by_module.zsh" 2>/dev/null || true
              cd "$tmpdir"
              exec "$tmpdir/gradle_by_module.zsh" "$@"
          passthrough: true
