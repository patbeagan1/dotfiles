  android-dump:
    about: A script for automated tasks.
    commands:
      help:
        about: Describe this script.
        exec:
          argv:
            - bash
            - '-lc'
            - |
              cat <<'EOF'
              android-dump

              A script for automated tasks.

              EOF
      run:
        about: 'Run the script (inlined); forwards args.'
        exec:
          argv:
            - bash
            - '-lc'
            - |
              set -euo pipefail
              tmpdir="$(mktemp -d)"
              trap 'rm -rf "$tmpdir"' EXIT
              cat >"$tmpdir/_android-dump" <<'JAN_EOF_android_dump__android_dump_1a56787e9d59'
              #compdef android-dump

              # Zsh completion for android-dump
              # Generated automatically - customize as needed

              _android-dump() {
                  local context state line
                  typeset -A opt_args
                  
                  _arguments -C \
                      '(-h --help)'{-h,--help}'[Show help information]' \
                      '(-v --version)'{-v,--version}'[Show version information]' \
                      '*::arg:_files'
              }

              _android-dump "$@"
              JAN_EOF_android_dump__android_dump_1a56787e9d59
              chmod +x "$tmpdir/_android-dump" 2>/dev/null || true
              cat >"$tmpdir/android-dump.sh" <<'JAN_EOF_android_dump_android_dump_sh_920fa61e5d2c'
              #!/usr/bin/env zsh
              # (c) 2022 Pat Beagan: MIT License

              set -euo pipefail
              IFS=$'\n\t'

              scriptname="$(basename "$0")"

              help () {
                  error_code=$?
                  echo "
              Usage: $scriptname [-h|--help]

              Shows the current top activity on the connected Android device using adb.
              This is useful for debugging and understanding what app is currently active.

              Requires:
                - ADB (Android Debug Bridge) to be installed and configured
                - An Android device connected via USB with USB debugging enabled

              Examples:
                $scriptname          # Shows current top activity
              "
                  exit $error_code
              }

              android-dump () {
              	adb shell dumpsys activity top
              }

              android-dump "$@" || help
              trackusage "$0"
              JAN_EOF_android_dump_android_dump_sh_920fa61e5d2c
              chmod +x "$tmpdir/android-dump.sh" 2>/dev/null || true
              cd "$tmpdir"
              exec "$tmpdir/android-dump.sh" "$@"
          passthrough: true
