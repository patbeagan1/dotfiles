about: >
  Read watcher diffs from unifier and write a status report of what
  changed when. Scheduled hourly via jan cron.
requires: [python3, unifier]
cron: "50 * * * *"
commands:
  help:
    about: Describe this script.
    exec:
      text: |
        report

        Read every watcher's unifier keys and write a status report:

          unifier get agents/status/report
          unifier get agents/status/summary
          unifier get agents/status/timeline
          unifier get agents/status/changed
          unifier get agents/status/updated_at

        `timeline` is the merged "what changed when" log across sites.
        `report` is the per-site dump including recent diffs.

        Scheduled: 50 past every hour (`cron: 50 * * * *`).
        Start the daemon: jan cron start && jan cron refresh

        Usage:
          jan scripts agents report run
          jan scripts agents show run
          jan cron --dry-run --at "2026-09-02 12:50"
  run:
    about: Build the unifier status report from watcher diffs
    exec:
      python: scripts/agents/report.py
